        - $ref: '#/components/schemas/IdempotencyConflictErrorResponse'

    TaskClaimUnavailableDetails:
      description: |
        Humans and bearer tokens with tasks:read may receive the full current
        task or active-claim diagnostics. Bearer tokens without tasks:read
        receive only id/version retry metadata for a task conflict, or an
        empty object for a column active-claim conflict.
      oneOf:
        - type: object
          required:
            - current
          properties:
            current:
              oneOf:
                - $ref: '#/components/schemas/Task'
                - $ref: '#/components/schemas/TaskConflictCurrent'
          additionalProperties: true
        - type: object
          required:
