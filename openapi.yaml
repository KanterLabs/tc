openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Roadmap API
  version: 1.0.0
  description: |
    Stable JSON API for the Roadmap project board and its built-in internal bug
    tracker. Humans use a session cookie or Cloudflare Access identity; agents
    use scoped bearer tokens.
    Single-resource responses contain the resource directly. Collections use
    a cursor-paginated object containing data and next_cursor. Collection
    cursors are opaque URL-safe offsets and an empty next_cursor means that
    there is no next page. Every response includes X-Request-ID; deployments
    that provide a release revision also include X-Roadmap-Revision.
    Cookie- and Cloudflare-authenticated mutations require an Origin that
    exactly matches the configured public origin; bearer-token mutations do
    not require Origin. Temporary bearer-authentication or request-body
    admission saturation returns 503 with Retry-After.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /
    description: Current Roadmap server
externalDocs:
  description: Roadmap v1 API contract
  url: docs/API_CONTRACT.md
security:
  - cookieAuth: []
  - bearerAuth: []
  - cloudflareAccess: []
x-authentication-modes:
  - local
  - cloudflare
  - disabled
x-common-response-headers: &commonResponseHeaders
  X-Request-ID:
    $ref: '#/components/headers/XRequestID'
  X-Roadmap-Revision:
    $ref: '#/components/headers/XRoadmapRevision'
x-resource-limits:
  request_body_bytes: 2097152
  agent_lifetime_mutation_budget_bytes: 67108864
  bearer_requests_per_second: 20
  bearer_burst: 40
  bearer_mutations_per_second: 1
  bearer_mutation_burst: 10
tags:
  - name: Health
    description: Liveness, readiness, and API discovery
  - name: Authentication
    description: Local account, session, and deployment identity operations
  - name: Projects
    description: Projects and their board columns
  - name: Columns
    description: Ordered semantic board columns
  - name: Tasks
    description: Tasks, internal bugs, comments, labels, and coordination actions
  - name: Audits
    description: Read-only board-audit snapshots and explicitly reviewed findings
  - name: Labels
    description: Project labels
  - name: My work
    description: Tasks assigned to the authenticated actor
  - name: Roadmap
    description: Progress summaries and activity
  - name: Events
    description: Append-only event feed for incremental polling
  - name: Agents
    description: Agent identities and scoped API tokens
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Check process liveness
      description: Returns 200 when the HTTP process is alive. This endpoint does not require authentication.
      tags:
        - Health
      security:
        - {}
      responses:
        '200':
          description: Process is alive
          headers: *commonResponseHeaders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              example:
                status: ok
                service: roadmap
                revision: 0123456789abcdef0123456789abcdef01234567
        '500':
          $ref: '#/components/responses/InternalServerError'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'

  /readyz:
    get:
      operationId: getReadiness
      summary: Check service readiness
      description: Returns 200 when the database and required dependencies are ready to serve traffic.
      tags:
        - Health
      security:
        - {}
      responses:
        '200':
          description: Service is ready
          headers: *commonResponseHeaders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              example:
                status: ok
                service: roadmap
                revision: 0123456789abcdef0123456789abcdef01234567
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'

  /health:
    get:
      operationId: getHealthAlias
      summary: Check process liveness
      description: Compatibility alias for /healthz. This endpoint does not require authentication.
      tags:
        - Health
      security:
        - {}
      responses:
        '200':
          description: Process is alive
          headers: *commonResponseHeaders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'

  /ready:
    get:
      operationId: getReadinessAlias
      summary: Check service readiness
      description: Compatibility alias for /readyz. This endpoint does not require authentication.
      tags:
        - Health
      security:
        - {}
      responses:
        '200':
          description: Service is ready
          headers: *commonResponseHeaders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'

  /openapi.json:
    get:
      operationId: getOpenApiDocument
      summary: Fetch the OpenAPI document
      description: Returns this contract as JSON for generated clients and contract tooling.
      tags:
        - Health
      security:
        - {}
      responses:
        '200':
          description: OpenAPI document
          headers: *commonResponseHeaders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenApiDocument'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'

  /api/v1:
    get:
      operationId: getApiDiscovery
      summary: Discover the Roadmap API
      description: Returns the API name, version, and optional deployed revision.
      tags:
        - Health
      security:
        - {}
      responses:
        '200':
          description: API discovery information
          headers: *commonResponseHeaders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiDiscovery'
              example:
                name: roadmap
                version: v1
                revision: 0123456789abcdef0123456789abcdef01234567
        '405':
          $ref: '#/components/responses/MethodNotAllowed'

  /api/v1/auth/status:
    get:
      operationId: getAuthStatus
      summary: Get authentication status
      description: Public deployment status. `disabled` is intended only for development.
      tags:
        - Authentication
      security:
        - {}
      responses:
        '200':
          description: Authentication mode and setup status
          headers: *commonResponseHeaders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStatus'
              examples:
                localSetupRequired:
                  value:
                    mode: local
                    configured: false
                    setup_required: true
                    authenticated: false
                    actor: null
                    user: null
                localAuthenticated:
                  value:
                    mode: local
                    configured: true
                    setup_required: false
                    authenticated: true
                    actor:
                      id: human_ada
                      kind: human
                      name: Ada Lovelace
                      email: ada@example.com
                      admin: true
                      created_at: '2026-08-27T08:00:00Z'
                      updated_at: '2026-08-27T10:00:00Z'
                    user:
                      id: human_ada
                      kind: human
                      name: Ada Lovelace
                      email: ada@example.com
                      admin: true
                      created_at: '2026-08-27T08:00:00Z'
                      updated_at: '2026-08-27T10:00:00Z'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'

  /api/v1/auth/setup:
    post:
      operationId: setupAuth
      summary: Create the first local administrator
      description: |
        Initializes local authentication exactly once and returns the newly-created
        administrator actor. `name` is optional and defaults to the local part of
        the email. Sign in with the login route to establish a session. The
        configured public Origin is required for this cookie-authentication
        setup mutation. Missing, null, mistyped, malformed, or schema-invalid
        fields return `400` (`invalid_request` or `invalid_json`).
      tags:
        - Authentication
      security:
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthSetupRequest'
            example:
              name: Ada Lovelace
              email: ada@example.com
              password: correct horse battery staple
      responses:
        '201':
          description: Administrator created
          headers: *commonResponseHeaders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Actor'
              examples:
                actor:
                  $ref: '#/components/examples/ActorExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Setup has already been completed
          headers: *commonResponseHeaders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: setup_already_complete
                  message: Authentication setup has already been completed
                  details: {}
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/auth/login:
    post:
      operationId: login
      summary: Sign in with a local account
      description: |
        Requires the configured public Origin; this route does not accept
        Idempotency-Key. Missing, null, mistyped, malformed, or schema-invalid
        fields return `400` (`invalid_request` or `invalid_json`). A syntactically
        valid request with credentials that do not authenticate returns `401`
        (`invalid_credentials`).
      tags:
        - Authentication
      security:
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: ada@example.com
              password: correct horse battery staple
      responses:
        '200':
          description: Signed in
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            X-Roadmap-Revision:
              $ref: '#/components/headers/XRoadmapRevision'
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Actor'
              examples:
                actor:
                  $ref: '#/components/examples/ActorExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          description: Credentials were not accepted
          headers: *commonResponseHeaders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: invalid_credentials
                  message: Email or password is incorrect
                  details: {}
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Sign out the current session
      description: |
        Clears the local session cookie. The route is intentionally callable
        without a valid session, but cookie-authenticated callers must send
        the configured public Origin. This route does not accept Idempotency-Key.
      tags:
        - Authentication
      security:
        - cookieAuth: []
        - bearerAuth: []
        - cloudflareAccess: []
        - {}
      responses:
        '200':
          description: Signed out
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            X-Roadmap-Revision:
              $ref: '#/components/headers/XRoadmapRevision'
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
              example:
                ok: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/auth/me:
    get:
      operationId: getCurrentActor
      summary: Get the authenticated actor
      tags:
        - Authentication
      responses:
        '200':
          description: Current human or agent actor
          headers: *commonResponseHeaders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Actor'
              examples:
                actor:
                  $ref: '#/components/examples/ActorExample'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/projects:
    get:
      operationId: listProjects
      summary: List projects
      tags:
        - Projects
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: archived
          in: query
          description: Include archived projects; defaults to false.
          required: false
          schema:
            type: boolean
            default: false
        - name: favorite
          in: query
          description: Restrict results to favorite projects.
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Cursor-paginated projects
          headers: *commonResponseHeaders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectCollection'
              examples:
                projects:
                  $ref: '#/components/examples/ProjectCollectionExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createProject
      summary: Create a project
      tags:
        - Projects
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreateRequest'
            example:
              key: OPS
              slug: operations
              name: Operations
              description: Work for the operations team.
              color: '#2563EB'
              favorite: true
      responses:
        '201':
          description: |
            Project created with the five default semantic columns. Humans and
            bearer tokens with projects:read receive the full project; a
            projects:write-only bearer receives only its id.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            X-Roadmap-Revision:
              $ref: '#/components/headers/XRoadmapRevision'
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMutationResponse'
              examples:
                project:
                  $ref: '#/components/examples/ProjectExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '507':
          $ref: '#/components/responses/InsufficientStorage'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/projects/{project}:
    parameters:
      - $ref: '#/components/parameters/ProjectPath'
    get:
      operationId: getProject
      summary: Get a project
      tags:
        - Projects
      responses:
        '200':
          description: Project
          headers: *commonResponseHeaders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
              examples:
                project:
                  $ref: '#/components/examples/ProjectExample'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      operationId: updateProject
      summary: Update a project
      description: |
        An empty object or a body with no recognized project field returns 400.
        Non-nullable properties reject explicit JSON `null`; string properties
        enforce their declared length and format constraints.
      tags:
        - Projects
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectPatchRequest'
            example:
              name: Platform Operations
              favorite: true
      responses:
        '200':
          description: |
            Updated project. Humans and bearer tokens with projects:read
            receive the full project; a projects:write-only bearer receives
            only its id.
          headers: *commonResponseHeaders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMutationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '507':
          $ref: '#/components/responses/InsufficientStorage'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/projects/{project}/columns:
    parameters:
      - $ref: '#/components/parameters/ProjectPath'
    get:
      operationId: listColumns
      summary: List a project's ordered columns
      tags:
        - Columns
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Cursor-paginated columns in board order
          headers: *commonResponseHeaders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ColumnCollection'
              example:
                data:
                  - id: col_backlog
                    project_id: proj_ops
                    name: Backlog
                    semantic_state: backlog
                    position: 0
                    created_at: '2026-08-27T08:00:00Z'
                    updated_at: '2026-08-27T08:00:00Z'
                  - id: col_ready
                    project_id: proj_ops
                    name: Ready
                    semantic_state: ready
                    position: 1
                    created_at: '2026-08-27T08:00:00Z'
                    updated_at: '2026-08-27T08:00:00Z'
                next_cursor: ''
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createColumn
      summary: Create a board column
      description: Project creation creates the default columns; this route adds an additional ordered column.
      tags:
        - Columns
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ColumnCreateRequest'
            example:
              name: Review
              semantic_state: active
              position: 2
      responses:
        '201':
          description: |
            Column created. Humans and bearer tokens with projects:read
            receive the full column; a projects:write-only bearer receives
            only its id and project_id.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            X-Roadmap-Revision:
              $ref: '#/components/headers/XRoadmapRevision'
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ColumnMutationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '507':
          $ref: '#/components/responses/InsufficientStorage'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/columns/{column}:
    parameters:
      - $ref: '#/components/parameters/ColumnPath'
    patch:
      operationId: updateColumn
      summary: Update a board column
      description: |
        An empty object or a body with no recognized column field returns 400.
        Non-nullable properties reject explicit JSON `null`; string properties
        enforce their declared length and format constraints. A human
        administrator may explicitly override an active task claim when
        changing a column's semantic state; bearer tokens and ordinary human
        actors cannot.
      tags:
        - Columns
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ColumnPatchRequest'
            example:
              name: In review
              position: 2
      responses:
        '200':
          description: |
            Updated column. Humans and bearer tokens with projects:read
            receive the full column; a projects:write-only bearer receives
            only its id and project_id.
          headers: *commonResponseHeaders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ColumnMutationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The column cannot change semantic state while a task in it has an
            active claim. Humans and bearer tokens with tasks:read retain
            diagnostic claim details; bearer tokens without tasks:read receive
            an empty details object.
          headers: *commonResponseHeaders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '507':
          $ref: '#/components/responses/InsufficientStorage'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    get:
      operationId: getColumn
      summary: Get a board column
      tags:
        - Columns
      responses:
        '200':
          description: Board column
          headers: *commonResponseHeaders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Column'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/projects/{project}/tasks:
    parameters:
      - $ref: '#/components/parameters/ProjectPath'
    get:
      operationId: listProjectTasks
      summary: List tasks in a project
      description: |
        Results are ordered by column position and task position. `state`,
        `column`, `kind`, `priority`, `severity`, `label`, `assignee`,
        `reporter`, `resolution`, `agent_state`, `action_needed`, `q`, and
        `updated_after` can be combined. `agent_state` filters the latest
        structured agent-work snapshot; `stale` and `missing` identify
        read-time liveness conditions. `action_needed=true` selects waiting,
        handoff, or stale snapshots. `action_needed=false` is accepted as an
        explicit no-op filter for clients that build filters dynamically.
        `state` filters by a column's semantic state. Supplied scalar filters
