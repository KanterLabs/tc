  /api/v1/my-work:
    get:
      operationId: listMyWork
      summary: List work assigned to the current actor
      description: |
        By default, returns tasks assigned to the authenticated actor across
        all projects, or across the requested project. Results include
        assigned tasks and tasks with an active claim owned by the actor. Set
        `view=live` for the coordination pulse view: it returns unfinished
        tasks that have a structured agent-work snapshot, ordered with
        action-needed pulses first. `view=assigned` is an explicit spelling of
        the legacy actor-assignment and active-claim view. `agent_state`,
        `action_needed`, and `dependency` can be combined with either view.
        `dependency=blocked` selects work with an unmet live prerequisite;
        `dependency=ready` requires at least one live prerequisite and none
        unmet, so tasks with no prerequisites do not match. An unknown requested
        project returns 404; a project-scoped token must name a project.
      tags:
        - My work
      parameters:
        - $ref: '#/components/parameters/MyWorkView'
        - $ref: '#/components/parameters/TaskState'
        - $ref: '#/components/parameters/PriorityFilter'
        - $ref: '#/components/parameters/LabelFilter'
        - $ref: '#/components/parameters/AgentStateFilter'
        - $ref: '#/components/parameters/ActionNeededFilter'
        - $ref: '#/components/parameters/DependencyFilter'
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/UpdatedAfter'
        - name: project
          in: query
          description: Restrict work to a project ID, key, or slug.
          required: false
          schema:
            $ref: '#/components/schemas/Identifier'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Cursor-paginated assigned tasks
          headers: *commonResponseHeaders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskCollection'
              examples:
                tasks:
                  $ref: '#/components/examples/TaskCollectionExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/roadmap:
    get:
      operationId: getRoadmap
      summary: Get the global roadmap summary
      description: |
        Due-soon counts cover incomplete tasks due from now through the next
        seven days. A project-scoped bearer token must supply the optional
        `project` query parameter; without it this global aggregate returns 403.
        Bearer tokens without tasks:read receive empty `upcoming` and
        `upcoming_tasks` arrays; tokens without events:read receive an empty
        `recent_activity` array. Project aggregates remain available with
        projects:read.
      tags:
        - Roadmap
      parameters:
        - name: project
          in: query
          description: Optionally restrict the summary to a project ID, key, or slug.
          required: false
          schema:
            $ref: '#/components/schemas/Identifier'
      responses:
        '200':
          description: Progress across projects
          headers: *commonResponseHeaders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoadmapResponse'
              examples:
                roadmap:
                  $ref: '#/components/examples/GlobalRoadmapExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/projects/{project}/roadmap:
    parameters:
      - $ref: '#/components/parameters/ProjectPath'
    get:
      operationId: getProjectRoadmap
      summary: Get a project's roadmap summary
      description: |
        Due-soon counts cover incomplete tasks due from now through the next
        seven days. Bearer tokens without tasks:read receive empty `upcoming`
        and `upcoming_tasks` arrays; tokens without events:read receive an empty
        `recent_activity` array. Project aggregates remain available with
        projects:read.
      tags:
        - Roadmap
      responses:
        '200':
          description: Project progress and activity
          headers: *commonResponseHeaders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoadmapResponse'
              examples:
                roadmap:
                  $ref: '#/components/examples/RoadmapExample'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/events:
    get:
      operationId: listEvents
      summary: Poll the append-only event feed
      description: |
        Supply `after` with the last integer cursor seen to receive subsequent
        project, task, claim, comment, completion, dependency, and bug
        lifecycle events.
        Agent progress publishes `task.progressed` events containing the
        machine-readable state and checkpoint counts. Bearer tokens with
        `events:read` but without `tasks:read` receive those coordination
        fields with progress narrative (`phase`, `summary`, `next_action`,
        and `checkpoint_refs`) redacted.
        Bug lifecycle events (`bug.created`, `bug.updated`, `bug.triaged`,
        `bug.resolved`, `bug.duplicated`, and `bug.reopened`) carry lifecycle
        and version metadata and are emitted in the same transaction as the
        action. Resolution events include the selected resolution; a reopen
        reason is recorded in the atomic comment.created event associated with
        the action.
        A prerequisite's satisfied-state transition emits one bounded
        `task.dependency_state_changed` event for each direct live dependent.
        The enclosing event's `task_id` is the dependent; its payload contains
        dependent/prerequisite IDs and keys plus the resulting `satisfied`
        boolean. This derived notification does not increment the dependent's
        editable task version. Clients should refetch the affected task or
        dependency graph.
      tags:
        - Events
      parameters:
        - $ref: '#/components/parameters/AfterCursor'
        - name: project
          in: query
          description: Restrict events to a project ID, key, or slug.
          required: false
          schema:
            $ref: '#/components/schemas/Identifier'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Events after the requested cursor
          headers: *commonResponseHeaders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventCollection'
              examples:
                events:
                  $ref: '#/components/examples/EventCollectionExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/agents:
    get:
      operationId: listAgents
      summary: List agent actors
      description: Human administrators only; bearer agent tokens are never accepted for administration.
      tags:
        - Agents
      security:
        - cookieAuth: []
        - cloudflareAccess: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
