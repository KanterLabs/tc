openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Helm API
  version: 1.0.0
  description: |
    Stable JSON API for the Helm project board and its built-in internal bug
    tracker. Humans use a session cookie or Cloudflare Access identity; agents
    use scoped bearer tokens.
    Single-resource responses contain the resource directly. Collections use
    a cursor-paginated object containing data and next_cursor. Collection
    cursors are opaque URL-safe keyset markers (retained decimal/base64
    offsets remain accepted for compatibility) and an empty next_cursor means
    that there is no next page. Every response includes X-Request-ID; deployments
    that provide a release revision also include X-Roadmap-Revision.
    Cookie- and Cloudflare-authenticated mutations require an Origin that
    exactly matches the configured public origin; bearer-token mutations do
    not require Origin. Temporary bearer-authentication or request-body
    admission saturation returns 503 with Retry-After.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /
    description: Current Helm server
externalDocs:
  description: Helm v1 API contract
  url: docs/API_CONTRACT.md
security:
  - cookieAuth: []
  - bearerAuth: []
  - cloudflareAccess: []
x-authentication-modes:
  - local
  - cloudflare
  - disabled
x-common-response-headers: &commonResponseHeaders
  X-Request-ID:
    $ref: '#/components/headers/XRequestID'
  X-Roadmap-Revision:
    $ref: '#/components/headers/XRoadmapRevision'
x-resource-limits:
  request_body_bytes: 2097152
  agent_lifetime_mutation_budget_bytes: 67108864
  bearer_requests_per_second: 20
  bearer_burst: 40
  bearer_mutations_per_second: 1
  bearer_mutation_burst: 10
tags:
  - name: Health
    description: Liveness, readiness, and API discovery
  - name: Authentication
    description: Local account, session, and deployment identity operations
  - name: Projects
    description: Projects and their board columns
  - name: Columns
    description: Ordered semantic board columns
  - name: Tasks
    description: Tasks, internal bugs, comments, labels, and coordination actions
  - name: Audits
    description: Read-only board-audit snapshots and explicitly reviewed findings
  - name: Labels
    description: Project labels
  - name: My work
    description: Tasks assigned to the authenticated actor
  - name: Search
    description: Global task search across the caller's visible projects
  - name: Views
    description: Named, optionally shared global-search filter views
  - name: Roadmap
    description: Progress summaries and activity
  - name: Events
    description: Append-only event feed for incremental polling
  - name: Agents
    description: Agent identities and scoped API tokens
paths:
  /api/v1/search:
    get:
      operationId: searchTasks
      summary: Search tasks across visible projects
      description: |
        Returns tasks matching the supplied full-text or field filters. The
        project ceiling is applied before pagination, so a scoped bearer token
        never spends a page slot on an inaccessible match. `q` searches task
        keys, titles, descriptions, project names, labels, board state,
        priority, assignee/claim owner names, and bug details. When `q` is
        supplied, matching projects and saved views are included in the
        optional `projects` and `views` response fields for command navigation.
        `view` loads a saved view first; explicit query parameters override its
        matching filters without changing the saved view.
      tags:
        - Search
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - name: key
          in: query
          description: Match a task key such as OPS-42.
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: title
          in: query
          description: Case-insensitive substring match on task title.
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: description
          in: query
          description: Case-insensitive substring match on task description.
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - $ref: '#/components/parameters/LabelFilter'
        - $ref: '#/components/parameters/AssigneeFilter'
        - name: claim_owner
          in: query
          description: Match a claim owner ID or case-insensitive actor-name substring; use `none` for unclaimed tasks.
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - $ref: '#/components/parameters/TaskState'
        - $ref: '#/components/parameters/PriorityFilter'
        - name: project
          in: query
          description: Restrict results to a project ID, key, or stable slug.
          schema:
            $ref: '#/components/schemas/Identifier'
        - name: due_from
          in: query
          description: Include tasks due at or after this RFC3339 timestamp.
          schema:
            type: string
            format: date-time
        - name: due_to
          in: query
          description: Include tasks due at or before this RFC3339 timestamp.
          schema:
            type: string
            format: date-time
        - name: sort
          in: query
          description: Comma-separated stable sort terms such as `updated_at:desc,title:asc`.
          schema:
            type: string
            maxLength: 200
            pattern: '^[a-z_]+(?::(?:asc|desc))(?:,[a-z_]+(?::(?:asc|desc))){0,7}$'
        - name: view
          in: query
          description: Saved view ID to use as the initial filter set.
          schema:
            $ref: '#/components/schemas/Identifier'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Cursor-paginated global search results.
          headers: *commonResponseHeaders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalSearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/views:
    get:
      operationId: listSavedViews
      summary: List visible saved search views
      description: Returns views owned by the actor and shared views visible to the caller.
      tags:
        - Views
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Cursor-paginated saved views.
          headers: *commonResponseHeaders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedViewCollection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createSavedView
      summary: Create a saved search view
      description: The view owner may later update or delete the view. Shared views are readable by other actors who can access their filtered projects.
      tags:
        - Views
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavedViewCreateRequest'
            example:
              name: Urgent operations
              description: Open urgent work for the operations team.
              filters:
                priority: urgent
                project: operations
              sort:
                - field: updated_at
                  direction: desc
              shared: true
      responses:
        '201':
          description: Saved view created.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            X-Roadmap-Revision:
              $ref: '#/components/headers/XRoadmapRevision'
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/views/{view}:
    parameters:
      - name: view
        in: path
        required: true
        description: Opaque saved view ID.
        schema:
          $ref: '#/components/schemas/Identifier'
    get:
      operationId: getSavedView
      summary: Get a saved search view
      tags:
        - Views
      responses:
        '200':
          description: Saved view.
          headers: *commonResponseHeaders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      operationId: updateSavedView
      summary: Update an owned saved search view
      tags:
        - Views
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavedViewPatchRequest'
      responses:
        '200':
          description: Updated saved view.
          headers: *commonResponseHeaders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      operationId: deleteSavedView
      summary: Delete an owned saved search view
      tags:
        - Views
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Saved view deleted.
          headers: *commonResponseHeaders
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/views/{view}/search:
    parameters:
      - name: view
        in: path
        required: true
        description: Opaque saved view ID.
        schema:
          $ref: '#/components/schemas/Identifier'
    get:
      operationId: searchSavedView
      summary: Execute a saved search view
      description: Explicit search query parameters override matching saved-view filters for this request only.
      tags:
        - Search
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Search results produced from the saved view.
          headers: *commonResponseHeaders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalSearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /healthz:
    get:
      operationId: getHealth
      summary: Check process liveness
      description: Returns 200 when the HTTP process is alive. This endpoint does not require authentication.
      tags:
        - Health
      security:
        - {}
      responses:
        '200':
          description: Process is alive
          headers: *commonResponseHeaders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              example:
                status: ok
                service: helm
                revision: 0123456789abcdef0123456789abcdef01234567
        '500':
          $ref: '#/components/responses/InternalServerError'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'

  /readyz:
    get:
      operationId: getReadiness
      summary: Check service readiness
      description: Returns 200 when the database and required dependencies are ready to serve traffic.
      tags:
        - Health
      security:
        - {}
      responses:
        '200':
          description: Service is ready
          headers: *commonResponseHeaders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              example:
                status: ok
                service: helm
                revision: 0123456789abcdef0123456789abcdef01234567
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'

  /health:
    get:
      operationId: getHealthAlias
      summary: Check process liveness
      description: Compatibility alias for /healthz. This endpoint does not require authentication.
      tags:
        - Health
      security:
        - {}
      responses:
        '200':
          description: Process is alive
          headers: *commonResponseHeaders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'

  /ready:
    get:
      operationId: getReadinessAlias
      summary: Check service readiness
      description: Compatibility alias for /readyz. This endpoint does not require authentication.
      tags:
        - Health
      security:
        - {}
      responses:
        '200':
          description: Service is ready
          headers: *commonResponseHeaders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'

  /openapi.json:
    get:
      operationId: getOpenApiDocument
      summary: Fetch the OpenAPI document
      description: Returns this contract as JSON for generated clients and contract tooling.
      tags:
        - Health
      security:
        - {}
      responses:
        '200':
          description: OpenAPI document
          headers: *commonResponseHeaders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenApiDocument'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'

  /api/v1:
    get:
      operationId: getApiDiscovery
      summary: Discover the Helm API
      description: Returns the API name, version, and optional deployed revision.
      tags:
        - Health
      security:
        - {}
      responses:
        '200':
          description: API discovery information
          headers: *commonResponseHeaders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiDiscovery'
              example:
                name: helm
                version: v1
                revision: 0123456789abcdef0123456789abcdef01234567
        '405':
          $ref: '#/components/responses/MethodNotAllowed'

  /api/v1/export:
    get:
      operationId: exportPortableArchive
      summary: Export a versioned portable archive
      description: |
        Exports live projects, columns, tasks, labels, comments, relationships,
        and activity references as a `helm.portable` v1 JSON archive. A
        `project` query selects one project; an unscoped caller may omit it to
        export every accessible project. This is a portability snapshot, not
        a database backup or restore operation.
      tags: [Projects]
      parameters:
        - name: project
          in: query
          required: false
          description: Project ID, key, or stable slug to export.
          schema:
            $ref: '#/components/schemas/Identifier'
      responses:
        '200':
          description: Portable archive JSON attachment
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
            X-Roadmap-Revision: { $ref: '#/components/headers/XRoadmapRevision' }
            X-Helm-Portable-Format:
              description: Portable envelope format identifier.
              schema: { type: string, example: helm.portable }
            X-Helm-Portable-Version:
              description: Portable envelope version.
              schema: { type: integer, example: 1 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortableArchive' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/import:
    post:
      operationId: importPortableArchive
      summary: Validate or import a portable archive
      description: |
        The archive is fully validated before any write. Set `dry_run` to true
        for a report without mutation. `conflict` defaults to `remap`; use
        `fail` to reject destination identifier conflicts. Stable IDs are kept
        whenever possible and every remap is listed in the report. Imports
        insert records transactionally and never replace or delete the
        destination database.
      tags: [Projects]
      parameters:
        - name: dry_run
          in: query
          required: false
          schema: { type: boolean, default: false }
        - name: conflict
          in: query
          required: false
          schema: { type: string, enum: [remap, fail], default: remap }
        - name: target_project
          in: query
          required: false
          description: Existing project ID, key, or slug to receive the imported archive.
          schema:
            $ref: '#/components/schemas/Identifier'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PortableArchiveRequestBody' }
      responses:
        '200':
          description: Validation or import report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortableImportReport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/import/trello:
    post:
      operationId: importTrelloBoard
      summary: Import a Trello board through the isolated adapter
      description: |
        Accepts a Trello board export/API JSON object and translates supported
        lists, cards, labels, due dates, and comment actions into a Helm
        portable archive. Unsupported Trello fields (including closed flags,
        list/card positions, idLabels, dueComplete, preferences, and unknown
        fields) are returned explicitly as warnings; the core Helm importer
        remains format-neutral.
      tags: [Projects]
      parameters:
        - name: dry_run
          in: query
          required: false
          schema: { type: boolean, default: false }
        - name: conflict
          in: query
          required: false
          schema: { type: string, enum: [remap, fail], default: remap }
        - name: target_project
          in: query
          required: false
          description: Existing project ID, key, or slug to receive the converted board.
          schema:
            $ref: '#/components/schemas/Identifier'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Validation or import report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortableImportReport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/auth/status:
    get:
      operationId: getAuthStatus
      summary: Get authentication status
      description: Public deployment status. `disabled` is intended only for development.
      tags:
        - Authentication
      security:
        - {}
      responses:
        '200':
          description: Authentication mode and setup status
          headers: *commonResponseHeaders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStatus'
              examples:
                localSetupRequired:
                  value:
                    mode: local
                    configured: false
                    setup_required: true
                    authenticated: false
                    actor: null
                    user: null
                localAuthenticated:
                  value:
                    mode: local
                    configured: true
                    setup_required: false
                    authenticated: true
                    actor:
                      id: human_ada
                      kind: human
                      name: Ada Lovelace
                      email: ada@example.com
                      admin: true
                      created_at: '2026-08-27T08:00:00Z'
                      updated_at: '2026-08-27T10:00:00Z'
                    user:
                      id: human_ada
                      kind: human
                      name: Ada Lovelace
                      email: ada@example.com
                      admin: true
                      created_at: '2026-08-27T08:00:00Z'
                      updated_at: '2026-08-27T10:00:00Z'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'

  /api/v1/auth/setup:
    post:
      operationId: setupAuth
      summary: Create the first local administrator
      description: |
        Initializes local authentication exactly once and returns the newly-created
        administrator actor. `name` is optional and defaults to the local part of
        the email. Sign in with the login route to establish a session. The
        configured public Origin is required for this cookie-authentication
        setup mutation. Missing, null, mistyped, malformed, or schema-invalid
        fields return `400` (`invalid_request` or `invalid_json`).
      tags:
        - Authentication
      security:
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthSetupRequest'
            example:
              name: Ada Lovelace
              email: ada@example.com
              password: correct horse battery staple
      responses:
        '201':
          description: Administrator created
          headers: *commonResponseHeaders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Actor'
              examples:
                actor:
                  $ref: '#/components/examples/ActorExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Setup has already been completed
          headers: *commonResponseHeaders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: setup_already_complete
                  message: Authentication setup has already been completed
                  details: {}
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/auth/login:
    post:
      operationId: login
      summary: Sign in with a local account
      description: |
        Requires the configured public Origin; this route does not accept
        Idempotency-Key. Missing, null, mistyped, malformed, or schema-invalid
        fields return `400` (`invalid_request` or `invalid_json`). A syntactically
        valid request with credentials that do not authenticate returns `401`
        (`invalid_credentials`).
      tags:
        - Authentication
      security:
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: ada@example.com
              password: correct horse battery staple
      responses:
        '200':
          description: Signed in
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            X-Roadmap-Revision:
              $ref: '#/components/headers/XRoadmapRevision'
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Actor'
              examples:
                actor:
