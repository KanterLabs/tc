    DependencyEventPayload:
      type: object
      required:
        - dependent_id
        - dependent_key
        - prerequisite_id
        - prerequisite_key
        - version
      description: |
        Payload for `task.dependency_added` and `task.dependency_removed`.
        `task_id` on the enclosing event is the dependent task; `version` is
        its resulting version after the graph mutation.
      properties:
        dependent_id:
          $ref: '#/components/schemas/Identifier'
        dependent_key:
          type: string
          pattern: '^[A-Z][A-Z0-9_-]{0,15}-[1-9][0-9]*$'
        prerequisite_id:
          $ref: '#/components/schemas/Identifier'
        prerequisite_key:
          type: string
          pattern: '^[A-Z][A-Z0-9_-]{0,15}-[1-9][0-9]*$'
        version:
          type: integer
          format: int64
          minimum: 1
      additionalProperties: false

    DependencyStateChangedEventPayload:
      type: object
      required:
        - dependent_id
        - dependent_key
        - prerequisite_id
        - prerequisite_key
        - satisfied
      description: |
        Payload for `task.dependency_state_changed`, emitted once for each
        direct live dependent when a prerequisite's satisfied state changes.
        The dependent's editable task version does not change for this derived
        readiness notification.
      properties:
        dependent_id:
          $ref: '#/components/schemas/Identifier'
        dependent_key:
          type: string
          pattern: '^[A-Z][A-Z0-9_-]{0,15}-[1-9][0-9]*$'
        prerequisite_id:
          $ref: '#/components/schemas/Identifier'
        prerequisite_key:
          type: string
          pattern: '^[A-Z][A-Z0-9_-]{0,15}-[1-9][0-9]*$'
        satisfied:
          type: boolean
          description: Whether the prerequisite is now complete in its completed semantic column.
      additionalProperties: false

    Event:
      type: object
      required:
        - cursor
        - id
        - type
        - created_at
        - payload
      properties:
        cursor:
          type: integer
          format: int64
          minimum: 1
          description: Monotonic feed cursor.
          example: 43
        id:
          $ref: '#/components/schemas/Identifier'
        type:
          type: string
          minLength: 1
          description: Event type, for example task.claimed, task.progressed, task.moved, task.completed, task.dependency_added, task.dependency_removed, task.dependency_state_changed, bug.triaged, bug.resolved, bug.duplicated, or bug.reopened.
          example: task.claimed
        actor_id:
          $ref: '#/components/schemas/Identifier'
        project_id:
          $ref: '#/components/schemas/Identifier'
        task_id:
          $ref: '#/components/schemas/Identifier'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        payload:
          type: object
          description: For task.dependency_added and task.dependency_removed, payload conforms to DependencyEventPayload; for task.dependency_state_changed, it conforms to DependencyStateChangedEventPayload; other event types define their own payload fields.
          additionalProperties: true
      additionalProperties: false

