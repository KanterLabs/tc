        '503':
          $ref: '#/components/responses/ServiceUnavailable'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: 'Scoped agent token sent as `Authorization: Bearer <token>`. '
      x-scopes:
        - projects:read
        - projects:write
        - tasks:read
        - tasks:write
        - tasks:claim
        - events:read
    cookieAuth:
      type: apiKey
      in: cookie
      name: roadmap_session
      description: HttpOnly local human session cookie.
    cloudflareAccess:
      type: apiKey
      in: header
      name: Cf-Access-Jwt-Assertion
      description: |
        Compact RS256 JWT assertion injected by a protected Cloudflare Access
        Tunnel. The server validates its signature, issuer, expiration, and
        configured UI/API application audience before using its signed email
        claim. Generic reverse-proxy identity headers are never accepted.
  headers:
    ETag:
      description: Strong project, column, task, or audit-finding version validator. Send this value as If-Match on the next guarded mutation of that resource.
      schema:
        type: string
        pattern: '^"v[1-9][0-9]*"$'
      example: '"v7"'
    Location:
      description: URL of the newly-created resource.
      schema:
        type: string
        format: uri-reference
      example: /api/v1/tasks/task_42
    SetCookie:
      description: Session cookie update. Clients should honor its security attributes.
      schema:
        type: string
      example: roadmap_session=opaque-session; Path=/; HttpOnly; SameSite=Lax
    XRequestID:
      description: Request correlation identifier generated by the server or accepted from the client.
      schema:
        type: string
        minLength: 1
        maxLength: 128
      example: 5f4dcc3b5aa765d6
    XRoadmapRevision:
      description: Deployed Git revision, when the server was started with a release revision.
      schema:
        type: string
        pattern: '^[0-9a-f]{40}$'
      example: 0123456789abcdef0123456789abcdef01234567

  parameters:
    ProjectPath:
      name: project
      in: path
      required: true
      description: Project ID, key, or stable slug.
      schema:
        $ref: '#/components/schemas/Identifier'
      example: operations
    ColumnPath:
      name: column
      in: path
      required: true
      description: Opaque column ID.
      schema:
        $ref: '#/components/schemas/Identifier'
      example: col_ready
    TaskPath:
      name: task
      in: path
      required: true
      description: Opaque task ID or project-local task key such as OPS-42; task keys are matched case-insensitively.
      schema:
        $ref: '#/components/schemas/Identifier'
      example: task_42
    CommentPath:
      name: comment
      in: path
      required: true
      description: Opaque comment ID.
      schema:
        $ref: '#/components/schemas/Identifier'
      example: comment_01
    DependencyPath:
      name: prerequisite
      in: path
      required: true
      description: Opaque prerequisite task ID or project-local task key such as OPS-41; task keys are matched case-insensitively.
      schema:
        $ref: '#/components/schemas/Identifier'
      example: OPS-41
    HierarchyChildPath:
      name: child
      in: path
      required: true
      description: Opaque child task ID or project-local task key such as OPS-42; task keys are matched case-insensitively.
      schema:
        $ref: '#/components/schemas/Identifier'
      example: OPS-42
    AuditPath:
      name: audit
      in: path
      required: true
      description: Opaque audit-run ID.
      schema:
        $ref: '#/components/schemas/Identifier'
      example: audit_42
    AuditFindingPath:
      name: finding
      in: path
      required: true
      description: Opaque audit-finding ID.
      schema:
        $ref: '#/components/schemas/Identifier'
      example: finding_42
    LabelPath:
      name: label
      in: path
      required: true
      description: Opaque label ID.
      schema:
        $ref: '#/components/schemas/Identifier'
      example: label_api
    AgentPath:
      name: agent
      in: path
      required: true
      description: Opaque agent actor ID.
      schema:
        $ref: '#/components/schemas/Identifier'
      example: agent_ada
    TokenPath:
      name: token
      in: path
      required: true
      description: Opaque API token ID.
      schema:
        $ref: '#/components/schemas/Identifier'
      example: tok_01
    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        Opaque cursor returned as next_cursor. Omit for the first page. Task
        board routes return a URL-safe keyset marker that includes the stable
        ordering tuple, project collection revision, fixed read timestamp, and
        task-collection revision; retained collection routes continue to accept a
        URL-safe base64 offset and raw non-negative decimal offset. An empty
        next_cursor terminates pagination, but a supplied empty `cursor` is
        invalid. Malformed, negative, or repeated values return 400. A changed
        task collection invalidates a board cursor with 409
        `task_collection_changed`; discard it and restart from the first page.
        It is not an event feed cursor.
      schema:
        type: string
        minLength: 1
      example: tc1.eyJ2IjoxLCJzb3J0IjoiYm9hcmQiLCJkZXNjIjpmYWxzZSwicHJvamVjdF9pZCI6InAiLCJyZXZpc2lvbiI6MCwicmVhZF9hdCI6IjIwMjYtMDEtMDFUMDA6MDA6MDBaIiwidGFza19jb2xsZWN0aW9uX3JldmlzaW9uIjowLCJjb2x1bW5faWQiOiJjIiwicG9zaXRpb24iOjAsIm51bWJlciI6MSwiaWQiOiJ0In0
    TaskSort:
      name: sort
      in: query
      required: false
      description: Stable server-side task ordering. Board order is the default.
      schema:
        type: string
        enum:
          - board
          - position
          - number
          - created_at
          - updated_at
          - priority
          - title
      example: position
    TaskOrder:
      name: order
      in: query
      required: false
      description: Direction for the selected task sort; defaults to ascending.
      schema:
        type: string
        enum:
          - asc
          - desc
      example: asc
    BeforeTimelineCursor:
      name: before
      in: query
      required: false
      description: Opaque item cursor returned by a prior timeline page. Omit for the newest page; malformed, empty, or repeated values are invalid.
      schema:
        type: string
        minLength: 1
        maxLength: 2048
      example: eyJ2IjoxLCJhdCI6IjIwMjYtMDgtMjdUMTA6MzA6MDBaIiwiZWMiOjQ0LCJrIjoiYWdlbnRfcHJvZ3Jlc3MiLCJpZCI6InByb2dyZXNzXzAxIn0
    TimelineKind:
      name: kind
      in: query
      required: false
      description: Restrict activity to one discriminated item kind.
      schema:
        type: string
        enum:
          - agent_progress
          - comment
          - task_change
      example: agent_progress
    Limit:
      name: limit
      in: query
      required: false
      description: Number of records to return; defaults to 50, rejects non-positive values with 400, and values above 200 are capped at 200.
      schema:
        type: integer
        minimum: 1
        default: 50
      example: 25
    AfterCursor:
      name: after
      in: query
      required: false
      description: Return events with a monotonic cursor greater than this value; supplied empty, negative, malformed, or repeated values are invalid.
      schema:
        type: integer
        format: int64
        minimum: 0
      example: 42
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Client-generated key for safely retrying a mutation. Reusing the same
        key with the same authenticated principal, method, path, and payload
        replays the original response before mutable resource lookup, including
        after the resource has been deleted or changed. Bearer-token retries
        are isolated by token credential, even when tokens belong to the same
        agent actor. Location and ETag from the original response are replayed;
        using the same key for another method, path, or payload under that
        principal returns 409 Conflict; different principals may reuse the
        visible key independently. Authentication
        setup, login, and logout do not accept this header, and secret token
        issuance rejects it so plaintext cannot be replay-cached.
      schema:
        type: string
        minLength: 1
        maxLength: 255
      example: 3d4f3b4c-3a14-4a84-a1f7-6a2d7ec5de8d
    RequiredIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Required client-generated key for safely retrying this dependency
        mutation. The value must contain at least one non-whitespace character
        and be at most 255 characters. Reusing it with the same authenticated
        principal, method, path, and payload replays the original response;
        using it for a different method, path, or payload under that same
        principal returns 409 with `idempotency_key_reused`. Different
        principals (and bearer credentials) have isolated key namespaces.
      schema:
        type: string
        minLength: 1
        maxLength: 255
        pattern: '.*\S.*'
      example: dependency-add-20260903-01
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: |
        Exact last observed task, audit-finding, or comment ETag. The value must
        be quoted as "vN" with N a positive decimal version. Missing If-Match
        returns 428, malformed values return 400, and a stale resource version
        returns 409 (task conflicts include the current task in
        error.details.current when the caller can read task details).
      schema:
        type: string
        pattern: '^"v[1-9][0-9]*"$'
      example: '"v7"'
    ProjectColumnIfMatch:
      name: If-Match
      in: header
      required: false
      description: |
        Optional last observed project or column ETag for an optimistic
        administration edit. Values use the quoted "vN" format. Omit this
        header only for legacy unguarded writes; stale guarded edits return
        409 with the current resource version in error details.
      schema:
        type: string
        pattern: '^"v[1-9][0-9]*"$'
      example: '"v3"'
    TaskState:
      name: state
      in: query
      required: false
      description: Filter by the task column's semantic state.
      schema:
        $ref: '#/components/schemas/SemanticState'
      example: ready
    ColumnFilter:
      name: column
      in: query
      required: false
      description: Filter by column ID or case-insensitive column name.
      schema:
        $ref: '#/components/schemas/Identifier'
      example: col_ready
    TaskKindFilter:
      name: kind
      in: query
      required: false
      description: Filter by task kind.
      schema:
        $ref: '#/components/schemas/TaskKind'
      example: bug
    PriorityFilter:
      name: priority
      in: query
      required: false
      description: Filter by task priority.
      schema:
        $ref: '#/components/schemas/Priority'
      example: high
    SeverityFilter:
      name: severity
      in: query
      required: false
      description: Filter by bug severity. Tasks without bug details do not match.
      schema:
        $ref: '#/components/schemas/BugSeverity'
      example: s1
    LabelFilter:
      name: label
      in: query
      required: false
      description: Filter by label ID or case-insensitive label name.
      schema:
        $ref: '#/components/schemas/Identifier'
      example: label_api
    AssigneeFilter:
      name: assignee
      in: query
      required: false
      description: Filter by assignee actor ID. Use `none` for unassigned tasks.
      schema:
        type: string
        minLength: 1
      example: agent_ada
    ReporterFilter:
      name: reporter
      in: query
      required: false
      description: Filter bug tasks by reporter actor ID.
      schema:
        $ref: '#/components/schemas/Identifier'
      example: human_ada
    ResolutionFilter:
      name: resolution
      in: query
      required: false
      description: Filter bug tasks by resolution; unresolved bugs have no resolution.
      schema:
        $ref: '#/components/schemas/BugResolution'
      example: fixed
    IssueSeverityFilter:
      name: severity
      in: query
      required: false
      description: Filter bug severity; use `untriaged` for bugs without a severity.
      schema:
        oneOf:
          - $ref: '#/components/schemas/BugSeverity'
          - type: string
            const: untriaged
      example: s1
    IssueResolutionFilter:
      name: resolution
      in: query
      required: false
      description: Filter bug resolution; use `unresolved` for bugs without a resolution.
      schema:
        oneOf:
          - $ref: '#/components/schemas/BugResolution'
          - type: string
            const: unresolved
      example: unresolved
    SearchQuery:
      name: q
      in: query
      required: false
      description: Case-insensitive task title and description search; values longer than 200 characters are invalid.
      schema:
        type: string
        maxLength: 200
      example: event polling
    UpdatedAfter:
      name: updated_after
      in: query
      required: false
      description: Return tasks updated after this UTC RFC 3339 timestamp.
      schema:
        $ref: '#/components/schemas/Timestamp'
      example: '2026-08-27T00:00:00Z'
    AgentStateFilter:
      name: agent_state
      in: query
      required: false
      description: |
        Filter by the latest agent-work state. `working`, `waiting`,
        `verifying`, and `handoff` are published states; `stale` and `missing`
        are read-time liveness states. Completed tasks retain their snapshot
        as history but never match this filter. Values are lowercase and
        repeated or invalid values return 400.
      schema:
        type: string
        enum:
          - working
          - waiting
          - verifying
          - handoff
          - stale
          - missing
      example: waiting
    ActionNeededFilter:
      name: action_needed
      in: query
      required: false
      description: |
        Strict lowercase boolean. `true` selects unfinished waiting, handoff,
        or stale agent-work snapshots; completed tasks never match. `false`
        leaves the result unfiltered. Empty, malformed, or repeated values
        return 400.
      schema:
        type: boolean
      example: true
    DependencyFilter:
      name: dependency
      in: query
      required: false
      description: |
        Filter by direct dependency readiness. `blocked` selects tasks with at
        least one live, same-project prerequisite that is not complete;
        `ready` selects tasks with at least one live prerequisite and no unmet
        prerequisites. Tasks with no prerequisites never match `ready`.
        Empty, repeated, or unsupported values return 400.
      schema:
        type: string
        enum:
          - blocked
          - ready
      example: blocked
    MyWorkView:
      name: view
      in: query
      required: false
      description: |
        Set to `live` for the coordination pulse view of unfinished tasks with
        agent-work snapshots. Set to `assigned` or omit it to retain the
        legacy actor-assignment and active-claim view. Empty, unsupported, or
        repeated values return 400.
      schema:
        type: string
        enum:
          - assigned
          - live
        default: assigned
      example: live

  responses:
    MethodNotAllowed:
      description: HTTP method is not supported for this route
      headers: *commonResponseHeaders
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: method_not_allowed
              message: Method not allowed
              details: {}
    BadRequest:
      description: Malformed request or unsupported parameter
      headers: *commonResponseHeaders
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            badRequest:
              $ref: '#/components/examples/BadRequestExample'
    Unauthorized:
      description: Authentication is required or credentials are invalid
      headers: *commonResponseHeaders
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unauthorized:
              $ref: '#/components/examples/UnauthorizedExample'
    Forbidden:
      description: Authenticated actor lacks permission or token scope
      headers: *commonResponseHeaders
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            forbidden:
              $ref: '#/components/examples/ForbiddenExample'
    NotFound:
      description: Resource was not found
      headers: *commonResponseHeaders
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            notFound:
              $ref: '#/components/examples/NotFoundExample'
    Conflict:
      description: Request conflicts with current state or idempotency history
      headers: *commonResponseHeaders
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            conflict:
              $ref: '#/components/examples/ConflictExample'
    StaleTask:
      description: |
        Task version is stale. Humans and tokens with tasks:read receive the
        full current task in details.current; write-only and claim-only bearer
        tokens receive only its id and version so read-protected fields are not
        disclosed.
      headers: *commonResponseHeaders
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StaleTaskErrorResponse'
          examples:
            staleTask:
              $ref: '#/components/examples/StaleTaskExample'
    TaskMutationConflict:
      description: |
        Task mutation conflicts are either a stale task version, an active
        claim held by another actor, or an idempotency key reused for a
        different request. Human administrators may explicitly override an
        active claim for task PATCH and DELETE; bearer tokens and ordinary
        human actors cannot.
      headers: *commonResponseHeaders
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TaskMutationConflictErrorResponse'
          examples:
            staleTask:
              $ref: '#/components/examples/StaleTaskExample'
            taskAlreadyClaimed:
              $ref: '#/components/examples/TaskAlreadyClaimedExample'
            idempotencyKeyReused:
              $ref: '#/components/examples/ConflictExample'
    TaskCollectionConflict:
      description: |
        A task collection keyset cursor is no longer valid because the
        project changed after the cursor was issued. Discard the cursor and
        restart the collection from its first page; the details object
        includes `restart: true` and the observed collection revisions.
      headers: *commonResponseHeaders
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TaskCollectionConflictErrorResponse'
          example:
            error:
              code: task_collection_changed
              message: task collection changed; restart pagination from the first page
              details:
                expected_revision: 42
                current_revision: 43
                expected_task_collection_revision: 7
                current_task_collection_revision: 8
                restart: true
    DependencyConflict:
      description: |
        Dependency mutations use stable conflict codes. `dependency_cycle`,
        `dependency_already_exists`, `dependency_in_use`, `stale_task`,
        `task_already_claimed`, and `idempotency_key_reused` are returned with
        HTTP 409 when the graph or mutation precondition conflicts with current
        state. Lifecycle guards also return `unmet_dependencies` when claim,
        start, finish, resolution, or semantic-column transitions would cross a
        boundary with an unsatisfied prerequisite. Conflict details are bounded
        by the 200-edge graph limit and scope-aware: a bearer token without
        `tasks:read` receives no relation IDs, keys, titles, timestamps,
        satisfaction flags, or cycle paths; only safe metadata such as a count,
        direction, or limit may remain.
      headers: *commonResponseHeaders
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            cycle:
              value:
                error:
                  code: dependency_cycle
                  message: dependency would create a cycle
                  details:
                    path:
                      - OPS-41
                      - OPS-42
                      - OPS-41
            stale:
              $ref: '#/components/examples/StaleTaskExample'
            idempotency:
              $ref: '#/components/examples/ConflictExample'
    PreconditionRequired:
      description: If-Match was missing from a task mutation (HTTP 428).
      headers: *commonResponseHeaders
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: if_match_required
              message: If-Match is required
              details: {}
    TooManyRequests:
      description: |
        Agent bearer rate limit exceeded. All bearer requests share an
        actor-keyed bucket of 20 requests per second with a burst of 40;
        mutations also share a 1 request per second bucket with a burst of 10.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
        X-Roadmap-Revision:
          $ref: '#/components/headers/XRoadmapRevision'
        Retry-After:
          schema:
            type: integer
            minimum: 1
          description: Number of seconds to wait before retrying.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: rate_limited
              message: Too many requests
              details:
                retry_after_seconds: 30
    InternalServerError:
      description: Unexpected server error
      headers: *commonResponseHeaders
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            internalError:
              $ref: '#/components/examples/InternalErrorExample'
    ServiceUnavailable:
      description: Readiness failed or a bounded authentication/body admission pool is temporarily full.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
        X-Roadmap-Revision:
          $ref: '#/components/headers/XRoadmapRevision'
        Retry-After:
          schema:
            type: integer
            minimum: 1
          description: Present for temporary admission saturation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            notReady:
              value:
                error:
                  code: not_ready
                  message: database unavailable
                  details: {}
            serverBusy:
              value:
                error:
                  code: server_busy
                  message: server is busy; retry later
                  details: {}
    RequestTooLarge:
      description: Request body exceeded the 2 MiB server limit.
      headers: *commonResponseHeaders
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: request_too_large
              message: request body exceeds 2 MiB
              details: {}
    InsufficientStorage:
      description: An agent's lifetime mutation resource budget is exhausted.
      headers: *commonResponseHeaders
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: resource_limit
              message: agent mutation resource budget exhausted
              details:
                operator_reset: ResetAgentMutationUsage

  schemas:
    Identifier:
      type: string
      minLength: 1
      maxLength: 200
      description: Opaque identifier. Clients must not infer its format.
    Timestamp:
      type: string
      format: date-time
      description: UTC RFC 3339 timestamp.
      example: '2026-08-27T10:00:00Z'
    NullableTimestamp:
      type:
        - string
        - 'null'
      format: date-time
      description: UTC RFC 3339 timestamp, or null when not applicable.
      example: null
    AuthMode:
      type: string
      enum:
        - local
        - cloudflare
        - disabled
      description: Authentication mode configured by the deployment.
    ActorKind:
      type: string
      enum:
        - human
        - agent
    SemanticState:
      type: string
      enum:
        - backlog
        - ready
        - active
        - blocked
        - completed
    ChecklistCompletionPolicy:
      type: string
      enum:
        - warn
        - require
      description: Whether completing a task with open checklist items warns or is rejected.
    AuditRunStatus:
      type: string
      enum:
        - queued
        - running
        - complete
        - partial
        - failed
      description: Audit lifecycle state. Queued and running are non-terminal; the remaining values are terminal.
    AuditTerminalStatus:
      type: string
      enum:
        - complete
        - partial
        - failed
      description: Terminal outcome accepted by the audit finalize endpoint.
    AuditVerdict:
      type: string
      enum:
        - correct
        - needs_attention
        - move_proposed
      description: Auditor conclusion for the captured task snapshot.
    AuditReviewState:
      type: string
      enum:
        - pending
        - approved
        - dismissed
      description: Human or agent review state for an audit finding.
    Priority:
      type: string
      enum:
        - low
        - normal
        - high
        - urgent
    TaskKind:
      type: string
      enum:
        - task
        - bug
      description: Work item kind. Bug-specific fields are present only for `bug`.
    BugSeverity:
      type: string
      enum:
        - s1
        - s2
        - s3
        - s4
      description: Impact severity for a bug, from s1 (highest) to s4 (lowest).
    BugResolution:
      type: string
      enum:
        - fixed
        - duplicate
        - not_planned
        - cannot_reproduce
        - works_as_designed
      description: Resolution recorded when a bug is resolved.
    Color:
      type: string
      pattern: '^#[0-9A-Fa-f]{6}$'
      description: Six-digit hexadecimal project or label color.
      example: '#2563EB'
    Scope:
      type: string
      enum:
        - projects:read
        - projects:write
        - tasks:read
        - tasks:write
        - tasks:claim
        - events:read

    HealthStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
        service:
          type: string
          example: helm
        revision:
          type: string
          pattern: '^[0-9a-f]{40}$'
          description: Git commit deployed by the release pipeline, when supplied by the runtime.
          example: 0123456789abcdef0123456789abcdef01234567
      additionalProperties: false

    IssueMetrics:
      type: object
      required:
        - reopened
        - window_days
        - since
        - as_of
      properties:
        reopened:
          type: integer
          minimum: 0
          description: Distinct live bug tasks reopened during the inclusive trailing seven-day UTC interval.
        window_days:
          type: integer
          const: 7
          description: Fixed trailing window used for the reopened metric.
        since:
          type: string
          format: date-time
          description: Inclusive UTC lower bound of the metric interval.
        as_of:
          type: string
          format: date-time
          description: Inclusive UTC upper bound and server evaluation time.
      additionalProperties: false

    SidebarCounts:
      type: object
      required:
        - issues
        - my_work
        - view
      properties:
        issues:
          type: integer
          minimum: 0
          description: Number of live bug tasks visible in the effective project ceiling.
        my_work:
          type: integer
          minimum: 0
          description: Number of tasks represented by the requested My Work view in the effective project ceiling.
        view:
          type: string
          enum:
            - live
            - assigned
          description: My Work view used for the my_work count.
      additionalProperties: false

    ApiDiscovery:
      type: object
      required:
        - name
        - version
      properties:
        name:
          const: helm
        version:
          const: v1
        revision:
          type: string
          pattern: '^[0-9a-f]{40}$'
          description: Git commit deployed by the release pipeline, when supplied by the runtime.
      additionalProperties: false

    OkResponse:
      type: object
      required:
        - ok
      properties:
        ok:
          const: true
      additionalProperties: false

    AuthStatus:
      type: object
      required:
        - mode
        - configured
        - setup_required
        - authenticated
        - actor
        - user
      properties:
        mode:
          $ref: '#/components/schemas/AuthMode'
        configured:
          type: boolean
          description: Whether an account is configured for the selected mode.
        setup_required:
          type: boolean
        authenticated:
          type: boolean
        actor:
          oneOf:
            - $ref: '#/components/schemas/Actor'
            - type: 'null'
        user:
          oneOf:
            - $ref: '#/components/schemas/Actor'
            - type: 'null'
      additionalProperties: false

    AuthSetupRequest:
      type: object
      required:
        - email
        - password
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 12
          writeOnly: true
      additionalProperties: false

    CodexAccountStatus:
      type: object
      required: [connected, requires_openai_auth]
      properties:
        connected: { type: boolean }
        account_type: { type: string, description: Display-safe provider type; Helm assistance requires chatgpt. }
        email: { type: string, format: email }
        plan_type: { type: string }
        requires_openai_auth: { type: boolean }
      additionalProperties: false

    CodexDeviceLogin:
      type: object
      required: [login_id, verification_url, user_code]
      properties:
        login_id: { type: string, minLength: 1, maxLength: 200 }
        verification_url: { type: string, format: uri, pattern: '^https://' }
        user_code: { type: string, minLength: 1, maxLength: 100 }
      additionalProperties: false

    CodexCancelLoginRequest:
      type: object
      required: [login_id]
      properties:
        login_id: { type: string, minLength: 1, maxLength: 200 }
      additionalProperties: false

    CodexCancelLoginResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [canceled, notFound]
      additionalProperties: false

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 1
          writeOnly: true
      additionalProperties: false

    Actor:
      type: object
      required:
        - id
        - kind
        - name
        - admin
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        kind:
          $ref: '#/components/schemas/ActorKind'
        name:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: string
          format: email
          maxLength: 320
          description: Human account email; omitted for agent actors.
        description:
          type: string
          maxLength: 10000
          description: Optional actor description; omitted when empty.
        admin:
          type: boolean
        disabled_at:
          $ref: '#/components/schemas/Timestamp'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        project_ids:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Identifier'
          description: Project access ceiling for an agent actor; omitted when unrestricted.
        tokens:
          type: array
          items:
            $ref: '#/components/schemas/Token'
          description: Token metadata for an agent actor; plaintext token values are never included here.
      additionalProperties: false

    Project:
      type: object
      required:
        - id
        - key
        - slug
        - name
        - description
        - color
        - favorite
        - checklist_completion_policy
        - created_at
        - updated_at
        - version
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        key:
          type: string
          pattern: '^[A-Z][A-Z0-9_-]{0,15}$'
          description: Short uppercase project key used in task references.
          example: OPS
        slug:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,63}$'
          maxLength: 64
          example: operations
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 20000
        color:
          $ref: '#/components/schemas/Color'
        favorite:
          type: boolean
        checklist_completion_policy:
          $ref: '#/components/schemas/ChecklistCompletionPolicy'
          description: Project completion behavior for tasks with open checklist items.
        archived_at:
          $ref: '#/components/schemas/Timestamp'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        task_count:
          type: integer
          minimum: 0
        completed_task_count:
          type: integer
          minimum: 0
        completed_count:
          type: integer
          minimum: 0
        open_task_count:
          type: integer
          minimum: 0
        overdue_task_count:
          type: integer
          minimum: 0
        column_count:
          type: integer
          minimum: 0
        version:
          type: integer
          minimum: 1
          description: Optimistic version for guarded administration edits.
      additionalProperties: false

    PortableActorReference:
      type: object
      required: [id, kind, name]
      properties:
        id: { $ref: '#/components/schemas/Identifier' }
        kind: { $ref: '#/components/schemas/ActorKind' }
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 20000 }
        disabled_at: { $ref: '#/components/schemas/NullableTimestamp' }
      additionalProperties: false

    PortableBug:
      type: object
      required: [reporter_id, actual_behavior, expected_behavior, reproduction_steps, environment, affected_version]
      properties:
        reporter_id: { $ref: '#/components/schemas/Identifier' }
        severity: { $ref: '#/components/schemas/BugSeverity' }
        actual_behavior: { type: string, minLength: 1, maxLength: 100000 }
        expected_behavior: { type: string, maxLength: 100000 }
        reproduction_steps: { type: string, maxLength: 100000 }
        environment: { type: string, maxLength: 100000 }
        affected_version: { type: string, maxLength: 100000 }
        resolution: { $ref: '#/components/schemas/BugResolution' }
        resolved_by: { $ref: '#/components/schemas/Identifier' }
        resolved_at: { $ref: '#/components/schemas/NullableTimestamp' }
        duplicate_of: { $ref: '#/components/schemas/Identifier' }
      additionalProperties: false

    PortableProject:
      type: object
      required: [id, key, slug, name, description, color, favorite, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/Identifier' }
        key: { type: string, pattern: '^[A-Z][A-Z0-9_-]{0,15}$' }
        slug: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,63}$', maxLength: 64 }
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 20000 }
        color: { $ref: '#/components/schemas/Color' }
        favorite: { type: boolean }
        archived_at: { $ref: '#/components/schemas/NullableTimestamp' }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
      additionalProperties: false

    PortableColumn:
      type: object
      required: [id, project_id, name, semantic_state, position, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/Identifier' }
        project_id: { $ref: '#/components/schemas/Identifier' }
        name: { type: string, minLength: 1, maxLength: 100 }
        semantic_state: { $ref: '#/components/schemas/SemanticState' }
        position: { type: integer, minimum: 0 }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
      additionalProperties: false

    PortableLabel:
      type: object
      required: [id, project_id, name, color, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/Identifier' }
        project_id: { $ref: '#/components/schemas/Identifier' }
        name: { type: string, minLength: 1, maxLength: 100 }
        color: { $ref: '#/components/schemas/Color' }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
      additionalProperties: false

    PortableTask:
      type: object
      required: [id, number, project_id, kind, column_id, title, description, priority, position, version, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/Identifier' }
        number: { type: integer, minimum: 1 }
        project_id: { $ref: '#/components/schemas/Identifier' }
        kind: { $ref: '#/components/schemas/TaskKind' }
        column_id: { $ref: '#/components/schemas/Identifier' }
        title: { type: string, minLength: 1, maxLength: 500 }
        description: { type: string, maxLength: 100000 }
        priority: { $ref: '#/components/schemas/Priority' }
        position: { type: number, minimum: 0, maximum: 1000000000000 }
        assignee_id: { $ref: '#/components/schemas/Identifier' }
        claimed_by: { $ref: '#/components/schemas/Identifier' }
        claim_expires_at: { $ref: '#/components/schemas/NullableTimestamp' }
        due_at: { $ref: '#/components/schemas/NullableTimestamp' }
        version: { type: integer, minimum: 1 }
        completed_at: { $ref: '#/components/schemas/NullableTimestamp' }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
        bug: { $ref: '#/components/schemas/PortableBug' }
      additionalProperties: false

    PortableComment:
      type: object
      required: [id, task_id, actor_id, body, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/Identifier' }
        task_id: { $ref: '#/components/schemas/Identifier' }
        actor_id: { $ref: '#/components/schemas/Identifier' }
        body: { type: string, minLength: 1, maxLength: 20000 }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
      additionalProperties: false

    PortableTaskLabel:
      type: object
      required: [task_id, label_id]
      properties:
        task_id: { $ref: '#/components/schemas/Identifier' }
        label_id: { $ref: '#/components/schemas/Identifier' }
      additionalProperties: false

    PortableDependency:
      type: object
      required: [task_id, prerequisite_task_id, created_at]
      properties:
        task_id: { $ref: '#/components/schemas/Identifier' }
        prerequisite_task_id: { $ref: '#/components/schemas/Identifier' }
        created_by: { $ref: '#/components/schemas/Identifier' }
        created_at: { $ref: '#/components/schemas/Timestamp' }
      additionalProperties: false

    PortableTaskLink:
      type: object
      required: [source_task_id, target_task_id, link_type, created_at]
      properties:
        source_task_id: { $ref: '#/components/schemas/Identifier' }
        target_task_id: { $ref: '#/components/schemas/Identifier' }
        link_type: { type: string, minLength: 1, maxLength: 200 }
        created_at: { $ref: '#/components/schemas/Timestamp' }
      additionalProperties: false

    PortableEvent:
      type: object
      required: [cursor, id, type, payload, created_at]
      properties:
        cursor: { type: integer, minimum: 0 }
        id: { $ref: '#/components/schemas/Identifier' }
        type: { type: string, minLength: 1, maxLength: 200 }
        actor_id: { $ref: '#/components/schemas/Identifier' }
        project_id: { $ref: '#/components/schemas/Identifier' }
        task_id: { $ref: '#/components/schemas/Identifier' }
        payload: { type: object, additionalProperties: true }
        created_at: { $ref: '#/components/schemas/Timestamp' }
      additionalProperties: false

    PortableRelationships:
      type: object
      required: [task_labels, dependencies, task_links]
      properties:
        task_labels: { type: array, items: { $ref: '#/components/schemas/PortableTaskLabel' } }
        dependencies: { type: array, items: { $ref: '#/components/schemas/PortableDependency' } }
        task_links: { type: array, items: { $ref: '#/components/schemas/PortableTaskLink' } }
      additionalProperties: false

    PortableActivity:
      type: object
      required: [events, agent_work, agent_work_history]
      properties:
        events: { type: array, items: { $ref: '#/components/schemas/PortableEvent' } }
        agent_work: { type: array, items: { type: object, additionalProperties: true } }
        agent_work_history: { type: array, items: { type: object, additionalProperties: true } }
      additionalProperties: false

    PortableArchive:
      type: object
      required: [format, version, exported_at, source, projects, columns, tasks, labels, relationships, activity, comments]
      properties:
        format: { type: string, const: helm.portable }
        version: { type: integer, const: 1 }
        exported_at: { $ref: '#/components/schemas/Timestamp' }
        source:
          type: object
          required: [product, api]
          properties:
            product: { type: string }
            api: { type: string }
          additionalProperties: false
        projects: { type: array, items: { $ref: '#/components/schemas/PortableProject' } }
        columns: { type: array, items: { $ref: '#/components/schemas/PortableColumn' } }
        tasks: { type: array, items: { $ref: '#/components/schemas/PortableTask' } }
        labels: { type: array, items: { $ref: '#/components/schemas/PortableLabel' } }
        actors: { type: array, items: { $ref: '#/components/schemas/PortableActorReference' } }
        relationships: { $ref: '#/components/schemas/PortableRelationships' }
        activity: { $ref: '#/components/schemas/PortableActivity' }
        comments: { type: array, items: { $ref: '#/components/schemas/PortableComment' } }
      additionalProperties: false

    PortableImportRequest:
      type: object
      required: [archive]
      properties:
        archive: { $ref: '#/components/schemas/PortableArchive' }
        dry_run: { type: boolean, default: false }
        conflict: { type: string, enum: [remap, fail], default: remap }
        target_project: { $ref: '#/components/schemas/Identifier' }
      additionalProperties: false

    PortableArchiveRequestBody:
      oneOf:
        - $ref: '#/components/schemas/PortableArchive'
        - $ref: '#/components/schemas/PortableImportRequest'

    PortableImportRemap:
      type: object
      required: [entity, source, target, reason]
      properties:
        entity: { type: string }
        source: { type: string }
        target: { type: string }
        field: { type: string }
        reason: { type: string }
      additionalProperties: false

    PortableImportReport:
      type: object
      required: [format, version, dry_run, conflict, counts, remaps, warnings, errors]
      properties:
        format: { type: string }
        version: { type: integer }
        dry_run: { type: boolean }
        conflict: { type: string, enum: [remap, fail] }
        counts: { type: object, additionalProperties: { type: integer, minimum: 0 } }
        remaps: { type: array, items: { $ref: '#/components/schemas/PortableImportRemap' } }
        warnings: { type: array, items: { type: string } }
        errors: { type: array, items: { type: object, additionalProperties: true } }
      additionalProperties: false

    BoardDescriptor:
      type: object
      required: [id, project_id, name, slug, default, enabled]
      properties:
        id: { $ref: '#/components/schemas/Identifier' }
        project_id: { $ref: '#/components/schemas/Identifier' }
        name: { type: string }
        slug: { type: string }
        default: { type: boolean }
        enabled: { type: boolean }
      additionalProperties: false

    BoardCollection:
      type: object
      required: [data, next_cursor, multi_board]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/BoardDescriptor' } }
        next_cursor: { type: string }
        multi_board:
          type: object
          required: [enabled, decision, migration_required, url_compatibility]
          properties:
            enabled: { type: boolean }
            decision: { type: string, const: deferred }
            migration_required: { type: boolean }
            url_compatibility: { type: string }
          additionalProperties: false
      additionalProperties: false

    ProjectCreateRequest:
      type: object
      required:
        - key
        - name
      properties:
        key:
          type: string
          pattern: '^[A-Za-z][A-Za-z0-9_-]{0,15}$'
          description: Normalized to uppercase by the runtime.
          example: OPS
        slug:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9-]{0,63}$'
          maxLength: 64
          description: Optional stable URL slug; normalized to lowercase and generated from name when omitted.
          example: operations
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 20000
          default: ''
        color:
          $ref: '#/components/schemas/Color'
        favorite:
          type: boolean
          default: false
        checklist_completion_policy:
          $ref: '#/components/schemas/ChecklistCompletionPolicy'
          default: warn
      additionalProperties: false

    TaskContextRequest:
      type: object
      required:
        - query
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 4000
          description: Rough task intent used only to rank project-local context.
      additionalProperties: false

    TaskContextProject:
      type: object
      required:
        - id
        - key
        - name
        - description
        - open_task_count
        - completed_task_count
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        key:
          type: string
        name:
          type: string
        description:
          type: string
        open_task_count:
          type: integer
          minimum: 0
        completed_task_count:
          type: integer
          minimum: 0
      additionalProperties: false

    TaskContextReference:
      type: object
      required:
        - id
        - key
        - title
        - description
        - priority
        - semantic_state
        - labels
        - prerequisite_count
        - dependent_count
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        key:
          type: string
        title:
          type: string
        description:
          type: string
          maxLength: 1200
        priority:
          $ref: '#/components/schemas/Priority'
        semantic_state:
          $ref: '#/components/schemas/SemanticState'
        labels:
          type: array
          items:
            type: string
        prerequisite_count:
          type: integer
          minimum: 0
        dependent_count:
          type: integer
          minimum: 0
        completed_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
      additionalProperties: false

    TaskDraftContext:
      type: object
      required:
        - project
        - completed_tasks
        - open_tasks
        - candidate_count
        - truncated
      properties:
        project:
          $ref: '#/components/schemas/TaskContextProject'
        completed_tasks:
          type: array
          maxItems: 12
          items:
            $ref: '#/components/schemas/TaskContextReference'
        open_tasks:
          type: array
          maxItems: 12
          items:
            $ref: '#/components/schemas/TaskContextReference'
        candidate_count:
          type: integer
          minimum: 0
        truncated:
          type: boolean
      additionalProperties: false

    TaskDraftSuggestion:
      type: object
      required: [title, description, acceptance_criteria, priority, rationale, supporting_task_keys]
      properties:
        title: { type: string, minLength: 1, maxLength: 500 }
        description: { type: string, maxLength: 12000 }
        acceptance_criteria:
          type: array
          minItems: 1
          maxItems: 12
          items: { type: string, minLength: 1, maxLength: 500 }
        priority: { $ref: '#/components/schemas/Priority' }
        rationale: { type: string, minLength: 1, maxLength: 2000 }
        supporting_task_keys:
          type: array
          maxItems: 12
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 80 }
      additionalProperties: false

    ProjectPatchRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 20000
        key:
          type: string
          pattern: '^[A-Za-z][A-Za-z0-9_-]{0,15}$'
          description: Normalized to uppercase by the runtime.
        slug:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9-]{0,63}$'
          maxLength: 64
          description: Normalized to lowercase by the runtime.
        color:
          $ref: '#/components/schemas/Color'
        favorite:
          type: boolean
        archived:
          type: boolean
          description: Archive or restore the project.
        checklist_completion_policy:
          $ref: '#/components/schemas/ChecklistCompletionPolicy'
          description: Warn by default, or require every checklist item before completion.
      additionalProperties: false

    ProjectMutationSummary:
      type: object
      description: Reduced project mutation response for bearer tokens without projects:read.
      required:
        - id
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
      additionalProperties: false

    ProjectMutationResponse:
      description: Full project for humans and projects:read tokens, or id-only metadata for projects:write-only bearer tokens.
      oneOf:
        - $ref: '#/components/schemas/Project'
        - $ref: '#/components/schemas/ProjectMutationSummary'

    Column:
      type: object
      required:
        - id
        - project_id
        - name
        - semantic_state
        - position
        - ordering_version
        - created_at
        - updated_at
        - version
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        project_id:
          $ref: '#/components/schemas/Identifier'
        name:
          type: string
          minLength: 1
          maxLength: 100
        semantic_state:
          $ref: '#/components/schemas/SemanticState'
        position:
          type: integer
          minimum: 0
        archived_at:
          $ref: '#/components/schemas/Timestamp'
        ordering_version:
          type: integer
          format: int64
          minimum: 1
          description: Incremented whenever task ordering in this column changes.
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        version:
          type: integer
          minimum: 1
          description: Optimistic version for guarded administration edits.
      additionalProperties: false

    ColumnCreateRequest:
      type: object
      required:
        - name
        - semantic_state
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        semantic_state:
          $ref: '#/components/schemas/SemanticState'
        position:
          type: integer
          minimum: 0
      additionalProperties: false

    ColumnPatchRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        semantic_state:
          $ref: '#/components/schemas/SemanticState'
        position:
          type: integer
          minimum: 0
        archived:
          type: boolean
          description: Archive or restore the column. Archiving rehomes its tasks to a same-state live column.
      additionalProperties: false

    ColumnMutationSummary:
      type: object
      description: Reduced column mutation response for bearer tokens without projects:read.
      required:
        - id
        - project_id
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        project_id:
          $ref: '#/components/schemas/Identifier'
      additionalProperties: false

    ColumnMutationResponse:
      description: Full column for humans and projects:read tokens, or id/project_id metadata for projects:write-only bearer tokens.
      oneOf:
        - $ref: '#/components/schemas/Column'
        - $ref: '#/components/schemas/ColumnMutationSummary'

    AuditRun:
      type: object
      required:
        - id
        - project_id
        - actor_id
        - scope
        - status
        - started_at
        - created_at
        - updated_at
        - finding_count
        - findings
      description: |
        Bounded metadata for one board-audit run. The server returns
        `findings: []` on this resource; findings are never expanded here and
        must be fetched through the cursor-paginated findings collection.
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        project_id:
          $ref: '#/components/schemas/Identifier'
        actor_id:
          $ref: '#/components/schemas/Identifier'
        scope:
          type: string
          minLength: 1
          maxLength: 200
        status:
          $ref: '#/components/schemas/AuditRunStatus'
        started_at:
          $ref: '#/components/schemas/Timestamp'
        finalized_at:
          $ref: '#/components/schemas/NullableTimestamp'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        finding_count:
          type: integer
          minimum: 0
        findings:
          type: array
          description: Always empty on the summary resource; use the findings collection for data.
          items:
            $ref: '#/components/schemas/AuditFinding'
      additionalProperties: false

    AuditRunCreateRequest:
      type: object
      required:
        - scope
      description: Start a queued or running audit run. Creating it never mutates tasks.
      properties:
        scope:
          type: string
          minLength: 1
          maxLength: 200
          description: Opaque audit selection label, such as `board` or `open_tasks`.
        status:
          type: string
          enum:
            - queued
            - running
          default: running
          description: Initial lifecycle state; omitted values default to `running`.
      additionalProperties: false

    AuditFinding:
      type: object
      required:
        - id
        - audit_id
        - task_id
        - captured_version
        - source_column
        - verdict
        - confidence
        - reason
        - evidence_refs
        - review_state
        - version
        - changed_since_audit
        - created_at
        - updated_at
      description: |
        Immutable observation of one task at the time of an audit. The server
        computes `changed_since_audit` at read time by comparing the current
        task version and source column with this finding's captured values.
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        audit_id:
          $ref: '#/components/schemas/Identifier'
        task_id:
          $ref: '#/components/schemas/Identifier'
        captured_version:
          type: integer
          format: int64
          minimum: 1
        source_column:
          $ref: '#/components/schemas/Identifier'
          description: Opaque column ID captured by the auditor.
        verdict:
          $ref: '#/components/schemas/AuditVerdict'
        proposed_semantic_destination:
          oneOf:
            - $ref: '#/components/schemas/SemanticState'
            - type: 'null'
          description: Suggested semantic destination for a move proposal; omitted when none was captured.
        confidence:
          type: number
          format: double
          minimum: 0
          maximum: 1
        reason:
          type: string
          minLength: 1
          maxLength: 2000
        evidence_refs:
          type: array
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 512
            pattern: '^[A-Za-z0-9/][A-Za-z0-9._:/+~-]*$'
          description: Safe, non-duplicated evidence identifiers without query strings, fragments, or executable/data URLs.
        review_state:
          $ref: '#/components/schemas/AuditReviewState'
        version:
          type: integer
          format: int64
          minimum: 1
          description: Finding review version used by If-Match.
        changed_since_audit:
          type: boolean
          description: True when the task version or source column differs from the captured snapshot.
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
      additionalProperties: false

    AuditFindingCreateRequest:
      type: object
      required:
        - task_id
        - captured_version
        - verdict
        - confidence
        - reason
      description: |
        Append one finding to a queued or running audit. Supply either
        `source_column` or its accepted alias `source_column_id`; when both
        are supplied they must match. `review_state` defaults to `pending`.
        The server validates the snapshot but never changes the task.
      properties:
        task_id:
          $ref: '#/components/schemas/Identifier'
        captured_version:
          type: integer
          format: int64
          minimum: 1
        source_column:
          $ref: '#/components/schemas/Identifier'
          description: Canonical opaque source column ID.
        source_column_id:
          $ref: '#/components/schemas/Identifier'
          description: Compatibility alias for `source_column`.
        verdict:
          $ref: '#/components/schemas/AuditVerdict'
        proposed_semantic_destination:
          oneOf:
            - $ref: '#/components/schemas/SemanticState'
            - type: 'null'
          description: Required for `move_proposed`; forbidden for other verdicts.
        confidence:
          type: number
          format: double
          minimum: 0
          maximum: 1
        reason:
          type: string
          minLength: 1
          maxLength: 2000
        evidence_refs:
          type: array
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 512
            pattern: '^[A-Za-z0-9/][A-Za-z0-9._:/+~-]*$'
          description: Safe, non-duplicated evidence identifiers without query strings, fragments, or executable/data URLs.
        review_state:
          type: string
          enum:
            - pending
          default: pending
          description: Findings always begin pending; approval and dismissal use the versioned review endpoint.
      anyOf:
        - required:
            - source_column
        - required:
            - source_column_id
      additionalProperties: false

    AuditFindingReviewRequest:
      type: object
      required:
        - review_state
      description: |
        Change only review metadata. Omitting
        `proposed_semantic_destination` preserves the existing suggestion;
        sending null clears it. The captured task snapshot remains immutable.
        Approval requires a `complete` or `partial` run and an unchanged task
        snapshot.
      properties:
        review_state:
          $ref: '#/components/schemas/AuditReviewState'
        proposed_semantic_destination:
          oneOf:
            - $ref: '#/components/schemas/SemanticState'
            - type: 'null'
          description: Optional replacement destination, or null to clear it.
      additionalProperties: false

    AuditFindingMutationSummary:
      type: object
      description: Reduced audit-finding mutation response for bearer tokens without tasks:read.
      required:
        - id
        - version
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        version:
          type: integer
          format: int64
          minimum: 1
      additionalProperties: false

    AuditFindingMutationResponse:
      description: Full finding for humans and tasks:read tokens, or id/version metadata for write-only bearer tokens.
      oneOf:
        - $ref: '#/components/schemas/AuditFinding'
        - $ref: '#/components/schemas/AuditFindingMutationSummary'

    AuditFinalizeRequest:
      type: object
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/AuditTerminalStatus'
      additionalProperties: false

    TaskMoveRequest:
      type: object
      required:
        - source
      description: |
        Guarded raw board move intent. Supply one or more agreeing aliases
        from each destination/source group; canonical names are
        `destination_column_id` and `expected_source_column_id`. `source` is
        required provenance and `reason` is optional. The server assigns the
        destination position atomically, so `position` and other fields are
        rejected. Anchor-enabled requests can place a card precisely before,
        after, first, last, or between visible neighbors.
      properties:
        destination_column_id:
          $ref: '#/components/schemas/Identifier'
        destination_column:
          $ref: '#/components/schemas/Identifier'
          description: Alias for `destination_column_id`.
        to_column_id:
          $ref: '#/components/schemas/Identifier'
          description: Alias for `destination_column_id`.
        to_column:
          $ref: '#/components/schemas/Identifier'
          description: Alias for `destination_column_id`.
        column_id:
          $ref: '#/components/schemas/Identifier'
          description: Alias for `destination_column_id`.
        column:
          $ref: '#/components/schemas/Identifier'
          description: Alias for `destination_column_id`.
        expected_source_column_id:
          $ref: '#/components/schemas/Identifier'
        source_column_id:
          $ref: '#/components/schemas/Identifier'
          description: Alias for `expected_source_column_id`.
        from_column_id:
          $ref: '#/components/schemas/Identifier'
          description: Alias for `expected_source_column_id`.
        expected_column_id:
          $ref: '#/components/schemas/Identifier'
          description: Alias for `expected_source_column_id`.
        source_column:
          $ref: '#/components/schemas/Identifier'
          description: Alias for `expected_source_column_id`.
        from_column:
          $ref: '#/components/schemas/Identifier'
          description: Alias for `expected_source_column_id`.
        source:
          type: string
          minLength: 1
          maxLength: 200
          description: Required bounded provenance label, for example `board_audit`.
        reason:
          type: string
          minLength: 1
          maxLength: 10000
          description: Optional bounded explanation; when supplied it must not be empty.
        before_task_id:
          $ref: '#/components/schemas/Identifier'
          description: Place immediately before this destination-column anchor.
        before_task:
          $ref: '#/components/schemas/Identifier'
          description: Alias for `before_task_id`.
        before:
          $ref: '#/components/schemas/Identifier'
          description: Alias for `before_task_id`.
        after_task_id:
          $ref: '#/components/schemas/Identifier'
          description: Place immediately after this destination-column anchor.
        after_task:
          $ref: '#/components/schemas/Identifier'
          description: Alias for `after_task_id`.
        after:
          $ref: '#/components/schemas/Identifier'
          description: Alias for `after_task_id`.
        placement:
          type: string
          enum: [first, before, between, after, last]
          description: Explicit first/last placement or anchor relationship.
        expected_ordering_version:
          type: integer
          format: int64
          minimum: 0
          description: Convenience revision guard applied to both columns.
        ordering_version:
          type: integer
          format: int64
          minimum: 0
          description: Alias for `expected_ordering_version`.
        expected_source_ordering_version:
          type: integer
          format: int64
          minimum: 0
        source_ordering_version:
          type: integer
          format: int64
          minimum: 0
          description: Alias for `expected_source_ordering_version`.
        expected_destination_ordering_version:
          type: integer
          format: int64
          minimum: 0
        destination_ordering_version:
          type: integer
          format: int64
          minimum: 0
          description: Alias for `expected_destination_ordering_version`.
      allOf:
        - anyOf:
            - required:
                - destination_column_id
            - required:
                - destination_column
            - required:
                - to_column_id
            - required:
                - to_column
            - required:
                - column_id
            - required:
                - column
        - anyOf:
            - required:
                - expected_source_column_id
            - required:
                - source_column_id
            - required:
                - from_column_id
            - required:
                - expected_column_id
            - required:
                - source_column
            - required:
                - from_column
      additionalProperties: false

    TaskReorderRequest:
      description: Precise guarded board placement; this shape is shared with the anchor-enabled task move endpoint.
      allOf:
        - $ref: '#/components/schemas/TaskMoveRequest'

    TaskDependencyRequest:
      type: object
      required:
        - prerequisite
      description: Direct prerequisite reference for a dependency mutation.
      properties:
        prerequisite:
          $ref: '#/components/schemas/Identifier'
          description: Opaque task ID or case-insensitive project-local task key.
      additionalProperties: false

    TaskReference:
      type: object
      required:
        - id
        - key
        - title
        - completed_at
        - satisfied
      description: |
        Compact direct dependency reference. `completed_at` is null until the
        task is complete; `satisfied` is true only when the referenced task is
        complete in its completed semantic column. Relation fields are
        redacted according to the caller's task-read permission.
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        key:
          type: string
          pattern: '^[A-Z][A-Z0-9_-]{0,15}-[1-9][0-9]*$'
          example: OPS-41
        title:
          type: string
          minLength: 1
          maxLength: 500
        completed_at:
          $ref: '#/components/schemas/NullableTimestamp'
        satisfied:
          type: boolean
      additionalProperties: false

    TaskDependencies:
      type: object
      required:
        - prerequisites
        - dependents
      description: |
        Direct live dependency edges for one task. Both arrays are limited to
        200 items and contain only relations within the task's project; deleted
        tasks and historical dangling edges are omitted.
      properties:
        prerequisites:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/TaskReference'
        dependents:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/TaskReference'
      additionalProperties: false

    TaskHierarchyReference:
      type: object
      required:
        - id
        - number
        - key
        - project_id
        - title
        - kind
        - column_id
        - semantic_state
        - version
      description: Compact bounded parent/child reference. It never embeds a full task or nested relation collection.
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        number:
          type: integer
          minimum: 1
        key:
          type: string
          pattern: '^[A-Z][A-Z0-9_-]{0,15}-[1-9][0-9]*$'
        project_id:
          $ref: '#/components/schemas/Identifier'
        title:
          type: string
          minLength: 1
          maxLength: 500
        kind:
          $ref: '#/components/schemas/TaskKind'
        column_id:
          $ref: '#/components/schemas/Identifier'
        semantic_state:
          $ref: '#/components/schemas/SemanticState'
        state:
          $ref: '#/components/schemas/SemanticState'
        version:
          type: integer
          format: int64
          minimum: 1
        parent_id:
          oneOf:
            - $ref: '#/components/schemas/Identifier'
            - type: 'null'
        completed_at:
          $ref: '#/components/schemas/NullableTimestamp'
        agent_work:
          $ref: '#/components/schemas/AgentWork'
      additionalProperties: false

    HierarchySummary:
      type: object
      required:
        - child_count
        - completed_child_count
        - completion_percent
        - state_counts
        - blocked_child_count
        - live_agent_work_count
        - action_needed_count
        - stale_agent_work_count
      description: Server-derived direct-child rollups computed from live task, semantic-state, dependency, and agent-work rows.
      properties:
        child_count:
          type: integer
          minimum: 0
          maximum: 200
        completed_child_count:
          type: integer
          minimum: 0
          maximum: 200
        completion_percent:
          type: number
          minimum: 0
          maximum: 100
        state_counts:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        blocked_child_count:
          type: integer
          minimum: 0
          maximum: 200
        live_agent_work_count:
          type: integer
          minimum: 0
          maximum: 200
        action_needed_count:
          type: integer
          minimum: 0
          maximum: 200
        stale_agent_work_count:
          type: integer
          minimum: 0
          maximum: 200
      additionalProperties: false

    TaskHierarchy:
      type: object
      required:
        - children
        - ancestors
        - descendants
        - summary
      description: Bounded hierarchy view. Children are direct; ancestors and descendants are capped at 20 levels/200 references.
      properties:
        parent:
          oneOf:
            - $ref: '#/components/schemas/TaskHierarchyReference'
            - type: 'null'
        children:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/TaskHierarchyReference'
        ancestors:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/TaskHierarchyReference'
        descendants:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/TaskHierarchyReference'
        summary:
          $ref: '#/components/schemas/HierarchySummary'
      additionalProperties: false

    TaskHierarchyReferenceCollection:
      type: object
      required:
        - data
        - next_cursor
      properties:
        data:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/TaskHierarchyReference'
        next_cursor:
          type:
            - string
            - 'null'
      additionalProperties: false

    TaskHierarchyParentRequest:
      type: object
      minProperties: 1
      anyOf:
        - required: [parent]
        - required: [parent_id]
        - required: [parent_task_id]
      description: Parent task reference. `parent_id` and `parent_task_id` are accepted aliases.
      properties:
        parent:
          $ref: '#/components/schemas/Identifier'
        parent_id:
          $ref: '#/components/schemas/Identifier'
        parent_task_id:
          $ref: '#/components/schemas/Identifier'
      additionalProperties: false

    TaskHierarchyChildRequest:
      type: object
      minProperties: 1
      description: Child task reference. `child_id` and `child_task_id` are accepted aliases.
      properties:
        child:
          $ref: '#/components/schemas/Identifier'
        child_id:
          $ref: '#/components/schemas/Identifier'
        child_task_id:
          $ref: '#/components/schemas/Identifier'
      additionalProperties: false
    DependencySummary:
      type: object
      required:
        - prerequisite_count
        - unmet_prerequisite_count
        - dependent_count
        - blocked
      description: |
        Bounded derived summary included in task responses and collections.
        Counts cover direct live, same-project relations only. `blocked` is
        true when one or more direct prerequisites are not satisfied.
      properties:
        prerequisite_count:
          type: integer
          minimum: 0
          maximum: 200
        unmet_prerequisite_count:
          type: integer
          minimum: 0
          maximum: 200
        dependent_count:
          type: integer
          minimum: 0
          maximum: 200
        blocked:
          type: boolean
      additionalProperties: false

    TaskChecklistItem:
      type: object
      required:
        - id
        - task_id
        - text
        - position
        - completed
        - completed_at
        - completed_by
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        task_id:
          $ref: '#/components/schemas/Identifier'
        text:
          type: string
          minLength: 1
          maxLength: 1000
        position:
          type: integer
          minimum: 0
          maximum: 99
        completed:
          type: boolean
        completed_at:
          $ref: '#/components/schemas/NullableTimestamp'
        completed_by:
          oneOf:
            - $ref: '#/components/schemas/Identifier'
            - type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
      additionalProperties: false

    TaskChecklistSummary:
      type: object
      required:
        - total
        - completed
        - open
        - percent
        - completion_policy
        - warning
      properties:
        total:
          type: integer
          minimum: 0
          maximum: 100
        completed:
          type: integer
          minimum: 0
          maximum: 100
        open:
          type: integer
          minimum: 0
          maximum: 100
        percent:
          type: number
          minimum: 0
          maximum: 100
        completion_policy:
          $ref: '#/components/schemas/ChecklistCompletionPolicy'
        warning:
          type: boolean
          description: True when a completed task has open items under warn policy.
      additionalProperties: false

    TaskChecklistCollection:
      type: object
      required:
        - task_id
        - version
        - data
        - summary
      properties:
        task_id:
          $ref: '#/components/schemas/Identifier'
        version:
          type: integer
          format: int64
          minimum: 1
        data:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/TaskChecklistItem'
        summary:
          $ref: '#/components/schemas/TaskChecklistSummary'
      additionalProperties: false

    TaskChecklistItemRequest:
      type: object
      description: Text is required; title is accepted as a compatibility alias.
      oneOf:
        - required: [text]
        - required: [title]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 1000
        title:
          type: string
          minLength: 1
          maxLength: 1000
          description: Compatibility alias for text.
        completed:
          type: boolean
          default: false
        position:
          type: integer
          minimum: 0
          maximum: 100
      additionalProperties: false

    TaskChecklistItemPatchRequest:
      type: object
      minProperties: 1
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 1000
        completed:
          type: boolean
        position:
          type: integer
          minimum: 0
          maximum: 99
      additionalProperties: false

    TaskChecklistReorderRequest:
      type: object
      required:
        - item_ids
      properties:
        item_ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Identifier'
      additionalProperties: false

    Task:
      type: object
      required:
        - id
        - number
        - key
        - project_id
        - kind
        - column_id
        - title
        - description
        - priority
        - position
        - version
        - created_at
        - updated_at
        - labels
        - comment_count
        - checklist
        - checklist_summary
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        number:
          type: integer
          format: int64
          minimum: 1
          example: 42
        key:
          type: string
          pattern: '^[A-Z][A-Z0-9_-]{0,15}-[1-9][0-9]*$'
          example: OPS-42
        project_id:
          $ref: '#/components/schemas/Identifier'
        kind:
          $ref: '#/components/schemas/TaskKind'
        column_id:
          $ref: '#/components/schemas/Identifier'
        title:
          type: string
          minLength: 1
          maxLength: 500
        description:
          type: string
          description: Markdown task description.
          maxLength: 100000
        bug:
          $ref: '#/components/schemas/BugDetails'
          description: Bug-specific details; omitted for ordinary tasks.
        agent_work:
          $ref: '#/components/schemas/AgentWork'
          description: Latest structured agent progress snapshot; omitted when no pulse has been published.
        priority:
          $ref: '#/components/schemas/Priority'
        position:
          type: number
          format: double
          minimum: 0
          maximum: 1000000000000
        assignee:
          $ref: '#/components/schemas/Identifier'
          description: Assignee actor ID; omitted when unassigned.
        claimed_by:
          $ref: '#/components/schemas/Identifier'
          description: Actor ID holding the current claim; omitted when unclaimed.
        claim_expires_at:
          $ref: '#/components/schemas/Timestamp'
          description: Claim expiry; omitted when unclaimed.
        due_at:
          $ref: '#/components/schemas/Timestamp'
          description: Due timestamp; omitted when no due date is set.
        version:
          type: integer
          format: int64
          minimum: 1
          example: 7
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        completed_at:
          $ref: '#/components/schemas/Timestamp'
          description: Completion timestamp; omitted until the task is completed.
        labels:
          type: array
          items:
            $ref: '#/components/schemas/Label'
        comment_count:
          type: integer
          minimum: 0
        dependency_summary:
          $ref: '#/components/schemas/DependencySummary'
          description: Bounded direct dependency counts; omitted by legacy servers that predate dependency support.
        checklist:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/TaskChecklistItem'
        checklist_summary:
          $ref: '#/components/schemas/TaskChecklistSummary'
        parent_task_id:
          oneOf:
            - $ref: '#/components/schemas/Identifier'
            - type: 'null'
          description: Live same-project parent task ID; omitted when no parent is linked.
        parent_id:
          oneOf:
            - $ref: '#/components/schemas/Identifier'
            - type: 'null'
          description: Compatibility alias for parent_task_id.
        parent:
          oneOf:
            - $ref: '#/components/schemas/TaskHierarchyReference'
            - type: 'null'
          description: Compact parent reference when a live parent is linked.
        hierarchy_summary:
          $ref: '#/components/schemas/HierarchySummary'
          description: Server-derived direct-child rollup; arrays and counts never include deleted or cross-project rows.
      additionalProperties: false

    AgentWork:
      type: object
      required:
        - operation_id
        - actor_id
        - state
        - phase
        - summary
        - next_action
        - checkpoint_refs
        - started_at
        - updated_at
        - stale
        - action_needed
      description: |
        The latest complete agent progress snapshot for a task. `stale` is
        derived when the snapshot has not been updated within the server's
        liveness window. `action_needed` is true for waiting, handoff, or stale
        snapshots. A completed task retains this snapshot as history while
        both liveness flags are false. Checkpoint counts are either both
        present or both omitted.
      properties:
        operation_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9_.:/-]*$'
        actor_id:
          $ref: '#/components/schemas/Identifier'
          description: Actor that published the latest snapshot.
        state:
          type: string
          enum:
            - working
            - waiting
            - verifying
            - handoff
        phase:
          type: string
          maxLength: 120
        summary:
          type: string
          minLength: 1
          maxLength: 1000
        next_action:
          type: string
          maxLength: 1000
        checkpoint_refs:
          type: array
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
        checkpoint_completed:
          type: integer
          minimum: 0
          maximum: 100
        checkpoint_total:
          type: integer
          minimum: 1
          maximum: 100
        started_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        stale:
          type: boolean
        action_needed:
          type: boolean
      additionalProperties: false

    AgentWorkPublishRequest:
      type: object
      required:
        - operation_id
        - state
        - summary
      description: |
        Complete replacement snapshot for POST /api/v1/tasks/{task}/progress.
        Optional properties omitted from the request clear their previous
        values. Null is not accepted for any property. Checkpoint counts must
        be supplied together and satisfy 0 <= checkpoint_completed <=
        checkpoint_total <= 100; non-empty checkpoint_refs must have the same
        length as checkpoint_total.
      properties:
        operation_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9_.:/-]*$'
        state:
          type: string
          enum:
            - working
            - waiting
            - verifying
            - handoff
        phase:
          type: string
          maxLength: 120
        summary:
          type: string
          minLength: 1
          maxLength: 1000
        next_action:
          type: string
          maxLength: 1000
        checkpoint_refs:
          type: array
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
        checkpoint_completed:
          type: integer
          minimum: 0
          maximum: 100
        checkpoint_total:
          type: integer
          minimum: 1
          maximum: 100
      additionalProperties: false

    AgentWorkHeartbeatRequest:
      type: object
      required:
        - operation_id
      description: |
        Existing agent-work operation to keep alive. The heartbeat refreshes
        only the snapshot's `updated_at` timestamp; null and unknown
        properties are rejected.
      properties:
        operation_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9_.:/-]*$'
      additionalProperties: false

    BugDetails:
      type: object
      required:
        - reporter_id
        - actual_behavior
      description: |
        Details for a bug task. `actual_behavior` is required when a bug is
        created; the remaining fields are filled during triage and resolution.
        Unset fields are omitted. `severity` is nullable so a bug may be
        explicitly returned to an untriaged state.
      properties:
        reporter_id:
          $ref: '#/components/schemas/Identifier'
          description: Actor who reported the bug; set from the authenticated actor on creation.
        severity:
          type:
            - string
            - 'null'
          enum:
            - s1
            - s2
            - s3
            - s4
            - null
          description: Impact severity, from s1 (highest) to s4 (lowest), or null when untriaged.
        actual_behavior:
          type: string
          minLength: 1
          maxLength: 100000
          description: What the system actually did.
        expected_behavior:
          type: string
          maxLength: 100000
          description: What the system should have done.
        reproduction_steps:
          type: string
          maxLength: 100000
          description: Steps or inputs needed to reproduce the bug.
        environment:
          type: string
          maxLength: 10000
          description: Runtime, platform, or deployment context.
        affected_version:
          type: string
          maxLength: 200
          description: Application version known to be affected.
        resolution:
          oneOf:
            - $ref: '#/components/schemas/BugResolution'
            - type: 'null'
          description: Resolution; omitted for an open bug and null when explicitly cleared.
        resolved_by:
          oneOf:
            - $ref: '#/components/schemas/Identifier'
            - type: 'null'
          description: Actor who resolved the bug; omitted until resolution.
        resolved_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
          description: Resolution timestamp; omitted until resolution.
        duplicate_of:
          oneOf:
            - $ref: '#/components/schemas/Identifier'
            - type: 'null'
          description: Task ID of the canonical bug when resolution is duplicate.
      additionalProperties: false

    BugCreateDetails:
      type: object
      required:
        - actual_behavior
      description: Bug report fields accepted when creating a bug; reporter and lifecycle fields are server-managed.
      properties:
        severity:
          type:
            - string
            - 'null'
          enum:
            - s1
            - s2
            - s3
            - s4
            - null
        actual_behavior:
          type: string
          minLength: 1
          maxLength: 100000
        expected_behavior:
          type:
            - string
            - 'null'
          maxLength: 100000
        reproduction_steps:
          type:
            - string
            - 'null'
          maxLength: 100000
        environment:
          type:
            - string
            - 'null'
          maxLength: 10000
        affected_version:
          type:
            - string
            - 'null'
          maxLength: 200
      additionalProperties: false

    BugPatchDetails:
      type: object
      description: Partial bug report details merged by task PATCH; reporter and lifecycle fields are server-managed.
      properties:
        severity:
          type:
            - string
            - 'null'
          enum:
            - s1
            - s2
            - s3
            - s4
            - null
          description: Impact severity, or null to mark the bug untriaged.
        actual_behavior:
          type: string
          minLength: 1
          maxLength: 100000
        expected_behavior:
          type:
            - string
            - 'null'
          maxLength: 100000
        reproduction_steps:
          type:
            - string
            - 'null'
          maxLength: 100000
        environment:
          type:
            - string
            - 'null'
          maxLength: 10000
        affected_version:
          type:
            - string
            - 'null'
          maxLength: 200
      additionalProperties: false

    TaskMutationSummary:
      type: object
      description: Reduced task mutation response for bearer tokens without tasks:read.
      required:
        - id
        - version
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        version:
          type: integer
          format: int64
          minimum: 1
      additionalProperties: false

    TaskMutationResponse:
      description: Full task for humans and tasks:read tokens, or id/version metadata for bearer tokens without tasks:read. The ETag remains the strong task version validator.
      oneOf:
        - $ref: '#/components/schemas/Task'
        - $ref: '#/components/schemas/TaskMutationSummary'

    TaskCreateRequest:
      type: object
      required:
        - title
      description: |
        Create an ordinary task with `kind: task`, or an internal bug with
        `kind: bug` and nested `bug` details. When kind is omitted it defaults
        to `task` for compatibility. Bug creation requires
        `bug.actual_behavior`; other bug fields may be added during triage and
        resolution. The nested object is omitted for ordinary tasks.
      oneOf:
        - properties:
            kind:
              const: task
          required:
            - kind
          not:
            required:
              - bug
        - properties:
            kind:
              const: bug
          required:
            - kind
            - bug
        - not:
            anyOf:
              - required:
                  - kind
              - required:
                  - bug
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
        kind:
          $ref: '#/components/schemas/TaskKind'
          default: task
        description:
          type: string
          maxLength: 100000
          default: ''
        column_id:
          type: string
          minLength: 1
          description: Destination column; defaults to the project's backlog column.
        column:
          type: string
          minLength: 1
          description: Alias for column_id accepted by clients.
        priority:
          $ref: '#/components/schemas/Priority'
          default: normal
        position:
          type: number
          format: double
          minimum: 0
          maximum: 1000000000000
        assignee_id:
          type:
            - string
            - 'null'
          minLength: 1
        assignee:
          type:
            - string
            - 'null'
          minLength: 1
        due_at:
          $ref: '#/components/schemas/NullableTimestamp'
        label_ids:
          type:
            - array
            - 'null'
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Identifier'
        labels:
          type:
            - array
            - 'null'
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Identifier'
        bug:
          $ref: '#/components/schemas/BugCreateDetails'
          description: Required when kind is `bug`; omitted for kind `task`.
        parent:
          oneOf:
            - $ref: '#/components/schemas/Identifier'
            - type: 'null'
          description: Optional live same-project parent task ID or project-local key.
        parent_id:
          oneOf:
            - $ref: '#/components/schemas/Identifier'
            - type: 'null'
          description: Compatibility alias for parent.
        parent_task_id:
          oneOf:
            - $ref: '#/components/schemas/Identifier'
            - type: 'null'
          description: Compatibility alias for parent.
      additionalProperties: false

    TaskPatchRequest:
      type: object
      minProperties: 1
      description: |
        Patch ordinary task fields and, for bug tasks, merge fields in the
        nested `bug` object. Omitted nested fields remain unchanged. The
        `kind` field is optional because PATCH is partial.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
        kind:
          $ref: '#/components/schemas/TaskKind'
        description:
          type:
            - string
            - 'null'
          maxLength: 100000
          description: Markdown description; null clears it to an empty string.
        column_id:
          type: string
          minLength: 1
        column:
          type: string
          minLength: 1
        position:
          type: number
          format: double
          minimum: 0
          maximum: 1000000000000
        priority:
          $ref: '#/components/schemas/Priority'
        assignee_id:
          type:
            - string
            - 'null'
          minLength: 1
          description: Assignee actor ID; null clears the assignee.
        assignee:
          type:
            - string
            - 'null'
          minLength: 1
          description: Alias for assignee_id; null clears the assignee.
        due_at:
          $ref: '#/components/schemas/NullableTimestamp'
          description: Null clears the due timestamp.
        label_ids:
          type:
            - array
            - 'null'
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Identifier'
        labels:
          type:
            - array
            - 'null'
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Identifier'
        bug:
          $ref: '#/components/schemas/BugPatchDetails'
          description: Partial bug details; only valid for bug tasks.
        parent:
          oneOf:
            - $ref: '#/components/schemas/Identifier'
            - type: 'null'
          description: Link a live same-project parent task, or null to clear it.
        parent_id:
          oneOf:
            - $ref: '#/components/schemas/Identifier'
            - type: 'null'
          description: Compatibility alias for parent.
        parent_task_id:
          oneOf:
            - $ref: '#/components/schemas/Identifier'
            - type: 'null'
          description: Compatibility alias for parent.
      additionalProperties: false

    ClaimRequest:
      type: object
      description: Lease duration is optional; omitted duration defaults to 1800 seconds. Explicit values are inclusive from 30 through 604800 seconds.
      properties:
        lease_seconds:
          type: integer
          minimum: 30
          maximum: 604800
          default: 1800
          description: Lease duration from the time the action is accepted.
        duration_seconds:
          type: integer
          minimum: 30
          maximum: 604800
          description: Compatibility alias for lease_seconds.
      additionalProperties: false

    CompleteRequest:
      type: object
      properties:
        comment:
          type: string
          maxLength: 10000
          description: Optional Markdown completion note.
      additionalProperties: false

    BlockRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 10000
          description: Optional Markdown explanation for blocking the task.
      additionalProperties: false

    TriageRequest:
      type: object
      required:
        - severity
      description: Set bug severity and optionally update task routing fields.
      properties:
        severity:
          $ref: '#/components/schemas/BugSeverity'
        priority:
          $ref: '#/components/schemas/Priority'
        assignee_id:
          type:
            - string
            - 'null'
          minLength: 1
          description: Assignee actor ID; null clears the assignee.
        assignee:
          type:
            - string
            - 'null'
          minLength: 1
          description: Alias for assignee_id; null clears the assignee.
        column_id:
          type: string
          minLength: 1
          description: Destination column.
        column:
          type: string
          minLength: 1
          description: Alias for column_id.
      additionalProperties: false

    ResolveRequest:
      type: object
      required:
        - resolution
      description: |
        Record a bug resolution. `duplicate_of` is required only when
        `resolution` is `duplicate`.
      properties:
        resolution:
          $ref: '#/components/schemas/BugResolution'
        duplicate_of:
          oneOf:
            - $ref: '#/components/schemas/Identifier'
            - type: 'null'
          description: Canonical task ID; required and non-null for duplicate resolution.
        note:
          type: string
          maxLength: 10000
          description: Optional Markdown resolution note recorded as a task comment atomically with the resolution.
      oneOf:
        - properties:
            resolution:
              const: duplicate
            duplicate_of:
