            application/json:
              schema:
                $ref: '#/components/schemas/AgentCollection'
              examples:
                agents:
                  $ref: '#/components/examples/AgentCollectionExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createAgent
      summary: Create an agent actor
      description: Agent actors have no email address; supply an optional description and project access ceiling.
