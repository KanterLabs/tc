  /api/v1/projects/{project}/tasks:
    parameters:
      - $ref: '#/components/parameters/ProjectPath'
    get:
      operationId: listProjectTasks
      summary: List tasks in a project
      description: |
        Results use a stable server-side ordering. `sort` accepts `board`,
        `position`, `number`, `created_at`, `updated_at`, `priority`, or
        `title`; `order` selects ascending or descending direction. The
        default is board order (column position, task position, number, ID).
        The returned `next_cursor` is a keyset marker scoped to that ordering;
        unchanged collections traverse without gaps or duplicates.
        Each task cursor also records the project collection revision, a fixed
        read timestamp, and a task-collection revision. If the project
        collection changes between pages, or while a page and its enrichment
        are being read, the server returns `409 task_collection_changed` with
        `details.restart=true`; discard the cursor and restart from the first
        page. Continuations use the cursor's original read timestamp for
        `stale` and `action_needed` filters.
        `state`,
        `column`, `kind`, `priority`, `severity`, `label`, `assignee`,
        `reporter`, `resolution`, `agent_state`, `action_needed`, `dependency`,
        `q`, and `updated_after` can be combined. `agent_state` filters the latest
        structured agent-work snapshot; `stale` and `missing` identify
        read-time liveness conditions. `action_needed=true` selects waiting,
        handoff, or stale snapshots among unfinished tasks; completed tasks
        retain their snapshot as history but never match an agent-work filter.
        `action_needed=false` is accepted as an explicit no-op filter for
        clients that build filters dynamically.
        `state` filters by a column's semantic state. `dependency=blocked`
        selects tasks with an unmet live prerequisite; `dependency=ready`
        selects tasks with at least one live prerequisite and none unmet (so a
        task with no prerequisites does not match). Supplied scalar filters are
        single-valued; empty identifier/enum/timestamp values and values outside
        their declared enum, format, or length are rejected with `400`.
      tags:
        - Tasks
      parameters:
        - $ref: '#/components/parameters/TaskState'
        - $ref: '#/components/parameters/ColumnFilter'
        - $ref: '#/components/parameters/TaskKindFilter'
        - $ref: '#/components/parameters/PriorityFilter'
        - $ref: '#/components/parameters/SeverityFilter'
        - $ref: '#/components/parameters/LabelFilter'
        - $ref: '#/components/parameters/AssigneeFilter'
        - $ref: '#/components/parameters/ReporterFilter'
        - $ref: '#/components/parameters/ResolutionFilter'
        - $ref: '#/components/parameters/AgentStateFilter'
        - $ref: '#/components/parameters/ActionNeededFilter'
        - $ref: '#/components/parameters/DependencyFilter'
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/UpdatedAfter'
        - $ref: '#/components/parameters/TaskSort'
        - $ref: '#/components/parameters/TaskOrder'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Cursor-paginated tasks
          headers: *commonResponseHeaders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskCollection'
              examples:
                tasks:
                  $ref: '#/components/examples/TaskCollectionExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/TaskCollectionConflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

    post:
