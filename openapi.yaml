  /api/v1/tasks/{task}/progress:
    parameters:
      - $ref: '#/components/parameters/TaskPath'
    post:
      operationId: publishTaskProgress
      summary: Publish an agent progress snapshot
      description: |
        Replace the task's live structured agent-work snapshot. The caller
        must have `tasks:claim`, send the exact current task ETag in
        `If-Match`, and hold the task's active claim. This is a complete
        snapshot: omitted optional fields clear their previous values. The
        mutation appends the progress event and its human-readable comment in
        the same transaction. Reusing an Idempotency-Key with the same
        authenticated principal, path, and request body replays the original
        response without publishing a second snapshot, comment, or event.
        `working`, `waiting`, `verifying`, and `handoff` are publishable states;
        `stale` and `missing` are read-time filter states only.
      tags:
        - Tasks
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentWorkPublishRequest'
            example:
              operation_id: codex/ops-release
              state: working
              phase: Implementing event polling
              summary: Added the progress persistence and HTTP contract.
              next_action: Run the focused API tests.
              checkpoint_refs:
                - api-contract
                - http-tests
              checkpoint_completed: 1
              checkpoint_total: 2
      responses:
        '200':
          description: |
            Updated task. Humans and bearer tokens with `tasks:read` receive
            the full task, while bearer tokens without `tasks:read` receive
            only `{id,version}`. The response includes the strong task ETag.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            X-Roadmap-Revision:
              $ref: '#/components/headers/XRoadmapRevision'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskMutationResponse'
              examples:
                full:
                  $ref: '#/components/examples/TaskProgressedExample'
                reduced:
                  $ref: '#/components/examples/TaskMutationSummaryExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/TaskMutationConflict'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '507':
          $ref: '#/components/responses/InsufficientStorage'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/tasks/{task}/heartbeat:
    parameters:
      - $ref: '#/components/parameters/TaskPath'
    post:
      operationId: heartbeatTaskAgentWork
      summary: Refresh an agent work heartbeat
      description: |
        Refresh only the `updated_at` liveness timestamp of the existing
        agent-work snapshot identified by `operation_id`. The caller must
        have `tasks:claim`, be allowed to access the task's project, own the
        task's active unexpired claim, and match both the snapshot actor and
        operation ID. The task must remain unfinished. Heartbeats are quiet
        and inherently idempotent: they do not change the task version or
        `tasks.updated_at`, replace any snapshot content, append comments or
        events, reserve the agent mutation budget, or persist idempotency
        records. `If-Match` is intentionally not required because the
        heartbeat never changes task state or its optimistic-concurrency
        version. `Idempotency-Key` is not supported; omit it.
      tags:
        - Tasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentWorkHeartbeatRequest'
            example:
              operation_id: codex/ops-release
      responses:
        '200':
          description: |
            Task with the unchanged version and refreshed agent-work
            timestamp. Humans and bearer tokens with `tasks:read` receive the
            full task; bearer tokens without `tasks:read` receive only
            `{id,version}` according to the normal mutation redaction. The
            strong task ETag is unchanged.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            X-Roadmap-Revision:
              $ref: '#/components/headers/XRoadmapRevision'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskMutationResponse'
              examples:
                full:
                  $ref: '#/components/examples/TaskHeartbeatExample'
                reduced:
                  $ref: '#/components/examples/TaskMutationSummaryExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
