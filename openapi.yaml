  /api/v1/agents/{agent}/tokens:
    parameters:
      - $ref: '#/components/parameters/AgentPath'
    post:
      operationId: createAgentToken
      summary: Create a scoped agent token
      description: |
        The plaintext token is returned only in this response and is never
        returned by later reads. This operation deliberately rejects an
        Idempotency-Key because replay caching would retain the plaintext.
      tags:
        - Agents
      security:
        - cookieAuth: []
        - cloudflareAccess: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenCreateRequest'
            example:
              name: CI polling token
              scopes:
                - projects:read
                - tasks:read
                - tasks:claim
                - events:read
              project_ids:
                - proj_ops
              expires_at: '2027-01-01T00:00:00Z'
      responses:
        '201':
          description: Token created; save the plaintext token now
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            X-Roadmap-Revision:
