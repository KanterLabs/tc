  /api/v1/tasks/{task}/move:
    parameters:
      - $ref: '#/components/parameters/TaskPath'
    post:
      operationId: moveTask
      summary: Apply a guarded task move
      description: |
        Moves an unfinished task to a backlog or ready column only. Task
        moves require `tasks:write`, the exact current task ETag in `If-Match`,
        and an `Idempotency-Key`. The expected source column is guarded in the
        same transaction as the task version and active-claim check; any live
        claim, including the caller's own, rejects the move. The server
        computes the destination position atomically when no anchors are
        supplied, so `position` is not a request field. Optional before/after
        anchors provide precise placement and are guarded by column ordering
        revisions. A successful move emits a `task.moved` event. This is
        the explicit apply step after a client has reviewed an audit finding;
        audit reads and finding review never apply moves.
      tags:
        - Tasks
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskMoveRequest'
            example:
              destination_column_id: col_ready
              expected_source_column_id: col_backlog
              source: board_audit
              reason: Approved board-audit recommendation.
      responses:
        '200':
          description: Moved task; the server allocated its destination position and emitted task.moved.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            X-Roadmap-Revision:
              $ref: '#/components/headers/XRoadmapRevision'
