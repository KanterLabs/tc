name: Helm CI and deploy

on:
  pull_request:
  push:
    branches: [main, beta]
  workflow_dispatch:
    inputs:
      rollback_sha:
        description: Retained 40-character release SHA to roll back to (leave blank for a normal deploy)
        required: false
        type: string

permissions:
  contents: read

# Checks are scoped to their workflow/ref so unrelated pull requests cannot
# block production. Production mutation jobs below use their own fixed,
# non-canceling lock.
concurrency:
  group: helm-${{ github.workflow }}-${{ github.ref }}
  # Pull-request checks may be superseded, but no main or beta workflow may be
  # canceled while it is carrying an environment deployment.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/beta' }}

jobs:
  checks:
    # A public repository must never run untrusted fork code on the homelab.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: homelab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Frontend checks and build
        working-directory: web
        run: |
          npm ci
          npm audit --audit-level=high
          npm run openapi:check
          npm run check
          npm test
          npm run build
      - name: Embed frontend and run Go checks
        run: |
          rm -rf -- internal/webassets/dist internal/frontend/dist
          install -d internal/webassets/dist internal/frontend/dist dist
          cp -a web/dist/. internal/webassets/dist/
          cp -a web/dist/. internal/frontend/dist/
          test -z "$(gofmt -l cmd internal)"
          # @version selects immutable tool modules; Go's public checksum
          # database verifies their content without adding tools to the app
          # module or production image.
          GOSUMDB=sum.golang.org go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.10
          go test ./...
          go vet ./...
          GOSUMDB=sum.golang.org go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
          bash -n deploy/*.sh deploy/helm-deploy-gateway
          ./deploy/test-deployment-security.sh
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o dist/helm ./cmd/helm
          docker compose config >/dev/null
      - name: Upload immutable binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: helm-binary-${{ github.sha }}
          path: dist/helm
          if-no-files-found: error
          retention-days: 14

  browser:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: homelab-heavy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install browser dependencies and build the app
        run: |
          cd web
          npm ci
          npx playwright install chromium
          npm run build
          cd ..
          rm -rf -- internal/webassets/dist
          install -d internal/webassets/dist
          cp -a web/dist/. internal/webassets/dist/
          CGO_ENABLED=0 go build -trimpath -o /tmp/helm-e2e ./cmd/helm
      - name: Run the real browser workflow
        env:
          HELM_E2E_BASE_URL: http://127.0.0.1:18080
        run: |
          test_dir=$(mktemp -d)
          cleanup() {
            if [[ -n "${server_pid:-}" ]]; then
              kill "$server_pid" >/dev/null 2>&1 || true
              wait "$server_pid" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT
          HELM_ADDR=127.0.0.1:18080 \
            HELM_DB="$test_dir/roadmap.db" \
            HELM_AUTH_MODE=disabled \
            HELM_PUBLIC_ORIGIN=http://127.0.0.1:18080 \
            HELM_SECURE_COOKIES=false \
            HELM_DEMO_SEED=false \
            /tmp/helm-e2e >"$test_dir/server.log" 2>&1 &
          server_pid=$!
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/readyz >/dev/null; then
              break
            fi
            if [[ "$attempt" -eq 30 ]]; then
              cat "$test_dir/server.log"
              exit 1
            fi
            sleep 1
          done
          cd web
          npm run e2e
          cd ..
          kill "$server_pid"
          wait "$server_pid" || true
          server_pid=
          HELM_ADDR=127.0.0.1:18081 \
            HELM_DB="$test_dir/local-roadmap.db" \
            HELM_AUTH_MODE=local \
            HELM_PUBLIC_ORIGIN=http://127.0.0.1:18081 \
            HELM_SECURE_COOKIES=false \
            HELM_DEMO_SEED=false \
            /tmp/helm-e2e >"$test_dir/local-server.log" 2>&1 &
          server_pid=$!
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18081/readyz >/dev/null; then
              break
            fi
            if [[ "$attempt" -eq 30 ]]; then
              cat "$test_dir/local-server.log"
              exit 1
            fi
            sleep 1
          done
          cd web
          HELM_E2E_BASE_URL=http://127.0.0.1:18081 npx playwright test e2e/onboarding.spec.ts
      - name: Upload browser diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: helm-browser-${{ github.sha }}
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
          retention-days: 7

  race:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: homelab-heavy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run Go race detector
        run: go test -race ./...

  container:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: homelab-heavy
    needs: checks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build immutable production image
        run: |
          image_dir="$RUNNER_TEMP/helm-container"
          install -d -m 0700 "$image_dir"
          docker build --pull --tag "helm:${GITHUB_SHA}" .
          docker image inspect "helm:${GITHUB_SHA}" >/dev/null
          container_id=$(docker run --detach "helm:${GITHUB_SHA}")
          cleanup() { docker rm --force "$container_id" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          ready=false
          for _ in $(seq 1 30); do
            if docker exec "$container_id" /usr/local/bin/helm healthcheck >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            docker logs "$container_id"
            exit 1
          fi
          docker exec "$container_id" /usr/local/bin/helm healthcheck
          docker cp "$container_id:/usr/local/bin/codex" "$image_dir/codex"
          test -x "$image_dir/codex"
          (cd "$image_dir" && sha256sum codex > codex.sha256)
          printf 'container_smoke=ok\n'
          image_tar="$image_dir/helm-${GITHUB_SHA}.tar"
          docker save --output "$image_tar" "helm:${GITHUB_SHA}"
          docker run --rm \
            --volume "$image_dir:/scan:ro" \
            aquasec/trivy:0.67.2@sha256:e2b22eac59c02003d8749f5b8d9bd073b62e30fefaef5b7c8371204e0a4b0c08 \
            image --input "/scan/helm-${GITHUB_SHA}.tar" \
            --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress
          gzip -n "$image_tar"
          sha256sum "$image_tar.gz" > "$image_tar.gz.sha256"
      - name: Upload immutable image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: helm-image-${{ github.sha }}
          path: |
            ${{ runner.temp }}/helm-container/helm-${{ github.sha }}.tar.gz
            ${{ runner.temp }}/helm-container/helm-${{ github.sha }}.tar.gz.sha256
            ${{ runner.temp }}/helm-container/codex
            ${{ runner.temp }}/helm-container/codex.sha256
          if-no-files-found: error
          retention-days: 14

  beta_deploy:
    if: ${{ github.ref == 'refs/heads/beta' && ((github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.rollback_sha == '')) }}
    needs: [checks, browser, race, container]
    runs-on: homelab
    environment:
      name: beta
      url: https://beta.shanekanterman.dev
    concurrency:
      group: helm-beta
      cancel-in-progress: false
    env:
      HELM_DEPLOY_ENVIRONMENT: beta
      HELM_PUBLIC_ORIGIN: https://beta.shanekanterman.dev
    steps:
      # github.sha is the selected beta commit; pinning the checkout prevents
      # a mutable branch ref from supplying deployment scripts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Download immutable binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: helm-binary-${{ github.sha }}
          path: dist
      - name: Restore binary executable mode
        run: |
          test -f dist/helm
          chmod 0755 dist/helm
          test -x dist/helm
      - name: Download tested Codex runtime
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: helm-image-${{ github.sha }}
          path: dist/container
      - name: Verify Codex runtime artifact
        run: |
          test -f dist/container/codex
          test -f dist/container/codex.sha256
          (cd dist/container && sha256sum --check --strict codex.sha256)
          install -m 0755 dist/container/codex dist/codex
      - name: Configure deploy identity
        env:
          DEPLOY_KEY: ${{ secrets.BETA_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.BETA_DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          [[ "$RUNNER_TEMP" = /* ]]
          ssh_dir="$RUNNER_TEMP/helm-ssh"
          install -d -m 0700 "$ssh_dir"
          printf '%s\n' "$DEPLOY_KEY" > "$ssh_dir/helm-deploy"
          chmod 0600 "$ssh_dir/helm-deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 0600 "$ssh_dir/known_hosts"
          printf '%s\n' \
            'Host 10.0.0.20' \
            "  IdentityFile $ssh_dir/helm-deploy" \
            "  UserKnownHostsFile $ssh_dir/known_hosts" \
            '  IdentitiesOnly yes' \
            '  BatchMode yes' \
            '  StrictHostKeyChecking yes' \
            > "$ssh_dir/config"
          chmod 0600 "$ssh_dir/config"
          printf 'HELM_SSH_CONFIG=%s\n' "$ssh_dir/config" >> "$GITHUB_ENV"
      - name: Capture previous beta release for recovery
        id: previous_release
        run: |
          status_output=$(./deploy/deploy-ci.sh status)
          previous_sha=$(sed -n 's/^current_sha=//p' <<<"$status_output")
          [[ "$previous_sha" = none || "$previous_sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'sha=%s\n' "$previous_sha" >> "$GITHUB_OUTPUT"
      - name: Prepare beta Cloudflare Access and tunnel
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.BETA_CLOUDFLARE_API_TOKEN }}
          HELM_ADMIN_EMAIL: ${{ secrets.BETA_ADMIN_EMAIL }}
          HELM_REQUIRE_DURABLE_SERVICE_TOKEN_CAPTURE: "1"
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$HELM_ADMIN_EMAIL"
          chmod 0755 deploy/*.sh deploy/helm-deploy-gateway
          cloudflare_dir="$RUNNER_TEMP/helm-cloudflare"
          install -d -m 0700 "$cloudflare_dir"
          printf 'HELM_CLOUDFLARED_TOKEN_FILE=%s\n' "$cloudflare_dir/cloudflared.token" >> "$GITHUB_ENV"
          printf 'HELM_OWNER_ENV_FILE=%s\n' "$cloudflare_dir/owner.env" >> "$GITHUB_ENV"
          ./deploy/cloudflare.sh prepare \
            "$cloudflare_dir/cloudflared.token" \
            "$cloudflare_dir/owner.env" \
            "$cloudflare_dir/helm-access-token.env"
      - name: Materialize beta release signing key
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.BETA_RELEASE_SIGNING_KEY }}
        run: |
          test -n "$RELEASE_SIGNING_KEY"
          install -d -m 0700 "$RUNNER_TEMP/helm-signing"
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/helm-signing/private.pem"
          chmod 0600 "$RUNNER_TEMP/helm-signing/private.pem"
      - name: Deploy to beta Proxmox guest
        env:
          HELM_RELEASE_SIGNING_KEY_FILE: ${{ runner.temp }}/helm-signing/private.pem
        run: ./deploy/deploy-ci.sh deploy "${GITHUB_SHA}"
      - name: Publish beta DNS and validate live Access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.BETA_CLOUDFLARE_API_TOKEN }}
          HELM_ADMIN_EMAIL: ${{ secrets.BETA_ADMIN_EMAIL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.BETA_CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.BETA_CF_ACCESS_CLIENT_SECRET }}
          HELM_REQUIRE_SERVICE_AUTH_PROBE: "1"
          PREVIOUS_RELEASE_SHA: ${{ steps.previous_release.outputs.sha }}
        run: |
          if ./deploy/cloudflare.sh publish && ./deploy/validate-live.sh; then
            exit 0
          fi
          printf 'post-deploy beta live validation failed; attempting automatic rollback\n' >&2
          if [[ "$PREVIOUS_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            if ! ./deploy/deploy-ci.sh rollback "$PREVIOUS_RELEASE_SHA"; then
              printf 'automatic beta rollback to %s failed\n' "$PREVIOUS_RELEASE_SHA" >&2
            else
              printf 'automatic beta rollback to %s completed; validation remains failed\n' "$PREVIOUS_RELEASE_SHA" >&2
            fi
          else
            printf 'no previous retained beta release is available; automatic rollback skipped\n' >&2
          fi
          exit 1
      - name: Remove beta deployment credentials
        if: ${{ always() }}
        run: |
          rm -f -- "$RUNNER_TEMP/helm-signing/private.pem"
          rm -rf -- "$RUNNER_TEMP/helm-ssh" "$RUNNER_TEMP/helm-cloudflare"
          rm -f -- dist/cloudflared.token dist/owner.env dist/helm-access-token.env

  beta_rollback:
    if: ${{ github.ref == 'refs/heads/beta' && github.event_name == 'workflow_dispatch' && inputs.rollback_sha != '' }}
    runs-on: homelab
    environment:
      name: beta
      url: https://beta.shanekanterman.dev
    concurrency:
      group: helm-beta
      cancel-in-progress: false
    env:
      HELM_DEPLOY_ENVIRONMENT: beta
      HELM_PUBLIC_ORIGIN: https://beta.shanekanterman.dev
    steps:
      # A manual rollback is beta-authorized only when dispatched from beta,
      # and its scripts are pinned to the selected beta commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Configure beta deploy identity
        env:
          DEPLOY_KEY: ${{ secrets.BETA_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.BETA_DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          [[ "$RUNNER_TEMP" = /* ]]
          ssh_dir="$RUNNER_TEMP/helm-ssh"
          install -d -m 0700 "$ssh_dir"
          printf '%s\n' "$DEPLOY_KEY" > "$ssh_dir/helm-deploy"
          chmod 0600 "$ssh_dir/helm-deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 0600 "$ssh_dir/known_hosts"
          printf '%s\n' \
            'Host 10.0.0.20' \
            "  IdentityFile $ssh_dir/helm-deploy" \
            "  UserKnownHostsFile $ssh_dir/known_hosts" \
            '  IdentitiesOnly yes' \
            '  BatchMode yes' \
            '  StrictHostKeyChecking yes' \
            > "$ssh_dir/config"
          chmod 0600 "$ssh_dir/config"
          printf 'HELM_SSH_CONFIG=%s\n' "$ssh_dir/config" >> "$GITHUB_ENV"
      - name: Roll back retained beta release
        env:
          ROLLBACK_SHA: ${{ inputs.rollback_sha }}
        run: |
          [[ "$ROLLBACK_SHA" =~ ^[0-9a-f]{40}$ ]]
          ./deploy/deploy-ci.sh rollback "$ROLLBACK_SHA"
      - name: Validate beta live Access after rollback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.BETA_CLOUDFLARE_API_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.BETA_CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.BETA_CF_ACCESS_CLIENT_SECRET }}
          HELM_REQUIRE_SERVICE_AUTH_PROBE: "1"
        run: ./deploy/validate-live.sh
      - name: Remove beta deployment credentials
        if: ${{ always() }}
        run: |
          rm -f -- "$RUNNER_TEMP/helm-signing/private.pem"
          rm -rf -- "$RUNNER_TEMP/helm-ssh" "$RUNNER_TEMP/helm-cloudflare"
          rm -f -- dist/cloudflared.token dist/owner.env dist/helm-access-token.env

  deploy:
    if: ${{ github.ref == 'refs/heads/main' && ((github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.rollback_sha == '')) }}
    needs: [checks, browser, race, container]
    runs-on: homelab
    environment:
      name: production
      url: https://tc.shanekanterman.dev
    concurrency:
      group: helm-production
      cancel-in-progress: false
    steps:
      # github.sha is the selected main commit; pinning the checkout prevents
      # a mutable branch ref from supplying deployment scripts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Download immutable binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: helm-binary-${{ github.sha }}
          path: dist
      - name: Restore binary executable mode
        run: |
          test -f dist/helm
          chmod 0755 dist/helm
          test -x dist/helm
      - name: Download tested Codex runtime
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: helm-image-${{ github.sha }}
          path: dist/container
      - name: Verify Codex runtime artifact
        run: |
          test -f dist/container/codex
          test -f dist/container/codex.sha256
          (cd dist/container && sha256sum --check --strict codex.sha256)
          install -m 0755 dist/container/codex dist/codex
      - name: Configure deploy identity
        env:
          DEPLOY_KEY: ${{ secrets.ROADMAP_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.ROADMAP_DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          [[ "$RUNNER_TEMP" = /* ]]
          ssh_dir="$RUNNER_TEMP/helm-ssh"
          install -d -m 0700 "$ssh_dir"
          printf '%s\n' "$DEPLOY_KEY" > "$ssh_dir/helm-deploy"
          chmod 0600 "$ssh_dir/helm-deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 0600 "$ssh_dir/known_hosts"
          printf '%s\n' \
            'Host 10.0.0.20' \
            "  IdentityFile $ssh_dir/helm-deploy" \
            "  UserKnownHostsFile $ssh_dir/known_hosts" \
            '  IdentitiesOnly yes' \
            '  BatchMode yes' \
            '  StrictHostKeyChecking yes' \
            > "$ssh_dir/config"
          chmod 0600 "$ssh_dir/config"
          printf 'HELM_SSH_CONFIG=%s\n' "$ssh_dir/config" >> "$GITHUB_ENV"
      - name: Capture previous release for recovery
        id: previous_release
        run: |
          status_output=$(./deploy/deploy-ci.sh status)
          previous_sha=$(sed -n 's/^current_sha=//p' <<<"$status_output")
          [[ "$previous_sha" = none || "$previous_sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'sha=%s\n' "$previous_sha" >> "$GITHUB_OUTPUT"
      - name: Prepare Cloudflare Access and tunnel
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.ROADMAP_CLOUDFLARE_API_TOKEN }}
          HELM_REQUIRE_DURABLE_SERVICE_TOKEN_CAPTURE: "1"
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          chmod 0755 deploy/*.sh deploy/helm-deploy-gateway
          cloudflare_dir="$RUNNER_TEMP/helm-cloudflare"
          install -d -m 0700 "$cloudflare_dir"
          printf 'HELM_CLOUDFLARED_TOKEN_FILE=%s\n' "$cloudflare_dir/cloudflared.token" >> "$GITHUB_ENV"
          printf 'HELM_OWNER_ENV_FILE=%s\n' "$cloudflare_dir/owner.env" >> "$GITHUB_ENV"
          ./deploy/cloudflare.sh prepare \
            "$cloudflare_dir/cloudflared.token" \
            "$cloudflare_dir/owner.env" \
            "$cloudflare_dir/helm-access-token.env"
      - name: Materialize release signing key
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.ROADMAP_RELEASE_SIGNING_KEY }}
        run: |
          test -n "$RELEASE_SIGNING_KEY"
          install -d -m 0700 "$RUNNER_TEMP/helm-signing"
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/helm-signing/private.pem"
          chmod 0600 "$RUNNER_TEMP/helm-signing/private.pem"
      - name: Deploy to Proxmox
        env:
          HELM_RELEASE_SIGNING_KEY_FILE: ${{ runner.temp }}/helm-signing/private.pem
        run: ./deploy/deploy-ci.sh deploy "${GITHUB_SHA}"
      - name: Publish DNS and validate live Access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.ROADMAP_CLOUDFLARE_API_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.ROADMAP_CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.ROADMAP_CF_ACCESS_CLIENT_SECRET }}
          HELM_REQUIRE_SERVICE_AUTH_PROBE: "1"
          PREVIOUS_RELEASE_SHA: ${{ steps.previous_release.outputs.sha }}
        run: |
          if ./deploy/cloudflare.sh publish && ./deploy/validate-live.sh; then
            exit 0
          fi
          printf 'post-deploy live validation failed; attempting automatic rollback\n' >&2
          if [[ "$PREVIOUS_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            if ! ./deploy/deploy-ci.sh rollback "$PREVIOUS_RELEASE_SHA"; then
              printf 'automatic rollback to %s failed\n' "$PREVIOUS_RELEASE_SHA" >&2
            else
              printf 'automatic rollback to %s completed; validation remains failed\n' "$PREVIOUS_RELEASE_SHA" >&2
            fi
          else
            printf 'no previous retained release is available; automatic rollback skipped\n' >&2
          fi
          exit 1
      - name: Remove deployment credentials
        if: ${{ always() }}
        run: |
          rm -f -- "$RUNNER_TEMP/helm-signing/private.pem"
          rm -rf -- "$RUNNER_TEMP/helm-ssh" "$RUNNER_TEMP/helm-cloudflare"
          rm -f -- dist/cloudflared.token dist/owner.env dist/helm-access-token.env

  rollback:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.rollback_sha != '' }}
    runs-on: homelab
    environment:
      name: production
      url: https://tc.shanekanterman.dev
    concurrency:
      group: helm-production
      cancel-in-progress: false
    steps:
      # A manual rollback is production-authorized only when dispatched from
      # main, and its scripts are pinned to the selected main commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Configure deploy identity
        env:
          DEPLOY_KEY: ${{ secrets.ROADMAP_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.ROADMAP_DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          [[ "$RUNNER_TEMP" = /* ]]
          ssh_dir="$RUNNER_TEMP/helm-ssh"
          install -d -m 0700 "$ssh_dir"
          printf '%s\n' "$DEPLOY_KEY" > "$ssh_dir/helm-deploy"
          chmod 0600 "$ssh_dir/helm-deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 0600 "$ssh_dir/known_hosts"
          printf '%s\n' \
            'Host 10.0.0.20' \
            "  IdentityFile $ssh_dir/helm-deploy" \
            "  UserKnownHostsFile $ssh_dir/known_hosts" \
            '  IdentitiesOnly yes' \
            '  BatchMode yes' \
            '  StrictHostKeyChecking yes' \
            > "$ssh_dir/config"
          chmod 0600 "$ssh_dir/config"
          printf 'HELM_SSH_CONFIG=%s\n' "$ssh_dir/config" >> "$GITHUB_ENV"
      - name: Roll back retained release
        env:
          ROLLBACK_SHA: ${{ inputs.rollback_sha }}
        run: |
          [[ "$ROLLBACK_SHA" =~ ^[0-9a-f]{40}$ ]]
          ./deploy/deploy-ci.sh rollback "$ROLLBACK_SHA"
      - name: Validate live Access after rollback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.ROADMAP_CLOUDFLARE_API_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.ROADMAP_CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.ROADMAP_CF_ACCESS_CLIENT_SECRET }}
          HELM_REQUIRE_SERVICE_AUTH_PROBE: "1"
        run: ./deploy/validate-live.sh
      - name: Remove deployment credentials
        if: ${{ always() }}
        run: |
          rm -f -- "$RUNNER_TEMP/helm-signing/private.pem"
          rm -rf -- "$RUNNER_TEMP/helm-ssh" "$RUNNER_TEMP/helm-cloudflare"
          rm -f -- dist/cloudflared.token dist/owner.env dist/helm-access-token.env
