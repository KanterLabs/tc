      description: |
        Restores a task deleted by the soft-delete endpoint. Restore requires
        the exact deleted task version in `If-Match` and an `Idempotency-Key`.
        A restore is accepted only while the task remains deleted; a stale or
        already-restored task returns a conflict. Retained claims are cleared
        so Undo never revives an expired or unknown lease.
