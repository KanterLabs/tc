name: helm

services:
  helm:
    # A local `docker compose up --build` uses the source tree.  Production
    # deployments use HELM_IMAGE; ROADMAP_IMAGE remains a compatibility alias.
    image: ${HELM_IMAGE:-${ROADMAP_IMAGE:-helm:local}}
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      HELM_ADDR: ${HELM_ADDR:-${ROADMAP_ADDR:-0.0.0.0:8080}}
      HELM_DB: ${HELM_DB:-${ROADMAP_DB:-/data/roadmap.db}}
      HELM_AUTH_MODE: ${HELM_AUTH_MODE:-${ROADMAP_AUTH_MODE:-local}}
      HELM_PUBLIC_ORIGIN: ${HELM_PUBLIC_ORIGIN:-${ROADMAP_PUBLIC_ORIGIN:-http://localhost:8080}}
      HELM_ADMIN_EMAIL: ${HELM_ADMIN_EMAIL:-${ROADMAP_ADMIN_EMAIL:-}}
      HELM_SECURE_COOKIES: ${HELM_SECURE_COOKIES:-${ROADMAP_SECURE_COOKIES:-false}}
      HELM_DEMO_SEED: ${HELM_DEMO_SEED:-${ROADMAP_DEMO_SEED:-true}}
      HELM_LUNA_ENABLED: ${HELM_LUNA_ENABLED:-${ROADMAP_LUNA_ENABLED:-true}}
      HELM_LUNA_MODEL: ${HELM_LUNA_MODEL:-${ROADMAP_LUNA_MODEL:-gpt-5.6-luna}}
      HELM_LUNA_EFFORT: ${HELM_LUNA_EFFORT:-${ROADMAP_LUNA_EFFORT:-medium}}
      ROADMAP_ADDR: ${ROADMAP_ADDR:-}
      ROADMAP_DB: ${ROADMAP_DB:-}
      ROADMAP_AUTH_MODE: ${ROADMAP_AUTH_MODE:-}
      ROADMAP_PUBLIC_ORIGIN: ${ROADMAP_PUBLIC_ORIGIN:-}
      ROADMAP_ADMIN_EMAIL: ${ROADMAP_ADMIN_EMAIL:-}
      ROADMAP_SECURE_COOKIES: ${ROADMAP_SECURE_COOKIES:-}
      ROADMAP_DEMO_SEED: ${ROADMAP_DEMO_SEED:-}
      ROADMAP_LUNA_ENABLED: ${ROADMAP_LUNA_ENABLED:-}
      ROADMAP_LUNA_MODEL: ${ROADMAP_LUNA_MODEL:-}
      ROADMAP_LUNA_EFFORT: ${ROADMAP_LUNA_EFFORT:-}
    volumes:
      - roadmap-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "/usr/local/bin/helm", "healthcheck"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 5

volumes:
  roadmap-data:
    name: roadmap_roadmap-data
