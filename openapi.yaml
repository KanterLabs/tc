  /api/v1/tasks/{task}/reorder:
    parameters:
      - $ref: '#/components/parameters/TaskPath'
    post:
      operationId: reorderTask
      summary: Place a task at a precise board position
      description: |
        Places an unfinished task before/after visible cards in the same or
        another column. Supply `placement: first` or `last`, or provide
        `before_task_id` and/or `after_task_id`; when both anchors are sent,
        the task is placed between them. The server resolves anchors against
        the complete column, so hidden cards remain in their relative order.
        Task reorders require `tasks:write`, the exact current task ETag in
        `If-Match`, and an `Idempotency-Key`. Optional source/destination
        `ordering_version` values reject stale filtered-board snapshots with
        `409` rather than silently overwriting another user's reorder. A
        successful reorder emits `task.moved` with placement and revision
        metadata; dense positions are rebalanced transactionally.
      tags:
        - Tasks
      security:
        - cookieAuth: []
        - cloudflareAccess: []
        - bearerAuth:
            - tasks:write
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskReorderRequest'
            example:
              destination_column_id: col_ready
              expected_source_column_id: col_backlog
              before_task_id: task-42
              after_task_id: task-41
              placement: between
              expected_source_ordering_version: 3
              expected_destination_ordering_version: 8
              source: board
              reason: Keyboard reorder.
      responses:
        '200':
          description: Precisely placed task with a strong ETag.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            X-Roadmap-Revision:
